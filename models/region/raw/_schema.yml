version: 2

models:
  - name: raw_depopulated_area
    description: >
      国土数値情報 A17（2017年（平成29年）版）の過疎地域データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもので、
      ジオメトリは WKB (BLOB) で保持する。
  - name: raw_special_soil_area
    description: >
      国土数値情報 A23（2016年（平成28年）版）の特殊土壌地帯データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもので、
      ジオメトリは WKB (BLOB) で保持する。
  - name: raw_specified_rural_area
    description: >
      国土数値情報 A25（2016年（平成28年）版）の特定農山村地域データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもので、
      ジオメトリは WKB (BLOB) で保持する。
