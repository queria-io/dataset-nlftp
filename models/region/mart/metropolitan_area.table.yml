schema: region
name: metropolitan_area
title: 三大都市圏計画区域
description: '首都圏・中部圏・近畿圏の政策区域のポリゴン。首都圏整備法・中部圏開発整備法・

  近畿圏整備法に基づいて指定された既成市街地・近郊整備地帯・都市開発区域・保全区域・

  近郊緑地保全区域などの範囲を、行政区域（令和7年版）の境界で切り分けたもの。

  国土数値情報 A03（2025年度版）が元データ。


  1 行 = 圏域・市区町村・区域・陸水等区分の組み合わせで、島や飛び地はマルチポリゴンに

  まとめてある。首都圏 504 行（1都7県・384 市区町村）、中部圏 584 行（9県・327 市区町村）、

  近畿圏 600 行（2府6県・291 市区町村）。区域の指定が無い部分も「無指定」の行で入るので、

  各圏域の全体を覆う。福井・滋賀・三重の 65 市町は中部圏と近畿圏の両方に入り、

  同じ場所に 2 つの行がある。


  区域区分のコードは圏域ごとに意味が違う。首都圏の 1 は既成市街地、近畿圏の 1 は

  既成都市区域、中部圏の 1 は都市整備区域。区分は section_type の名称で見る。

  区分どうしの重なりの扱いも圏域で違う。首都圏の近郊緑地保全区域（区分 4）は

  近郊整備地帯の中にあって区分 2 とは重ならないので、近郊整備地帯の全体は区分 2 と 4 を

  合わせたもの。中部圏は保全区域と都市整備区域の重なる部分を区分 4 として切り出している。

  近畿圏の近郊緑地保全区域（区分 5）は保全区域（区分 4）のポリゴンと重ねて入っていて、

  近畿圏の面積を区分ごとに足すと 816 km² を二重に数える。


  原典には属性がポリゴンの位置と合わない行が 3 つあり、行政区域（令和7年版）と重ねて

  ポリゴンの側を正として直している。中部圏の御浜町に紀宝町のコードが入っていた行、

  川崎市宮前区のコードに横浜市都筑区の名称が入っていた行、四條畷市の表記が違う行。


  区域の範囲は概ねの位置を示すもので、境界付近では実際の政策区域と異なることがある。

  最新の指定でないこともある。不動産の重要事項説明等の根拠には使えない。'
