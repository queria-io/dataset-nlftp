version: 2

models:
  - name: depopulated_area
    description: |
      過疎地域の指定区域ポリゴン。過疎地域自立促進特別措置法に基づいて
      公示された市町村および旧市町村の区域で、総務省自治行政局の過疎指定
      地域一覧に載る市町村名から行政区域データのポリゴンを抽出したもの。
      国土数値情報 A17（2017年（平成29年）版）が元データ。

      1 行 = 1 指定区域で、島や飛び地に分かれる分はマルチポリゴンにまとめて
      ある。区域は 816 で、過疎IDと行政区域コードは 1 対 1 に対応する。
      指定の区分（category_code）は、過疎市町村が 646・過疎地域とみなされる
      市町村が 25・過疎地域とみなされる区域（一部過疎）が 145。

      収録は提供元の最新版である 2017年（平成29年）時点の指定で、現在の指定
      ではない。根拠法の過疎地域自立促進特別措置法は 2021年3月末で失効し、
      過疎地域の持続的発展の支援に関する特別措置法に引き継がれて指定も
      見直されている。行政区域コードも 2017年時点のもので、その後の廃置分合は
      反映されていない。boundary.municipality（令和7年版）と結合するときは
      コードの変更を確かめる。

      過疎地域の指定が無い神奈川県は行そのものが無い。

      出典: 「国土数値情報（過疎地域データ）」（国土交通省）。
      原典資料は総務省自治行政局の過疎指定地域一覧。
    access: public
    columns:
      - name: area_code
      - name: lg_code
      - name: prefecture_code
      - name: prefecture_name
      - name: subprefecture_name
      - name: district_name
      - name: municipality_name
      - name: former_municipality_name
      - name: category_code
      - name: category
      - name: geometry
  - name: special_soil_area
    description: |
      特殊土壌地帯の指定区域ポリゴン。特殊土じょう地帯災害防除及び振興臨時措置法に
      基づいて指定された市町村および旧市町村の区域で、シラス・ボラ・コラ・赤ホヤ・
      花崗岩風化土・ヨナ・富士マサなど、雨水で侵食されやすく災害の起きやすい
      特殊な火山性土壌や風化土に広く覆われた地域が対象になる。
      国土数値情報 A23（2016年（平成28年）版）が元データ。

      1 行 = 1 指定区域で、島や飛び地に分かれる分はマルチポリゴンにまとめて
      ある。区域は 270 で、特殊土壌IDと行政区域コードは 1 対 1 に対応する。
      指定がある静岡・兵庫・鳥取・島根・岡山・広島・山口・愛媛・高知・福岡・
      熊本・大分・宮崎・鹿児島の 14 県だけに行がある。

      収録は提供元の最新版である 2016年（平成28年）時点の指定で、行政区域コードも
      その時点のもの。boundary.municipality（令和7年版）と結合するときは
      コードの変更を確かめる。

      出典: 「国土数値情報（特殊土壌地帯データ）」（国土交通省）。
    access: public
    columns:
      - name: area_code
      - name: lg_code
      - name: prefecture_code
      - name: prefecture_name
      - name: subprefecture_name
      - name: district_name
      - name: municipality_name
      - name: source_municipality_name
      - name: former_municipality_name
      - name: category_code
      - name: category
      - name: geometry
  - name: specified_rural_area
    description: |
      特定農山村地域の指定区域ポリゴン。特定農山村地域における農林業等の
      活性化のための基盤整備の促進に関する法律（特定農山村法）に基づいて
      指定された市町村および旧市町村の区域で、地勢などの地理的条件が悪く、
      農林業の生産条件が不利な山間の地域が対象になる。
      国土数値情報 A25（2016年（平成28年）版）が元データ。

      1 行 = 1 指定区域で、島や飛び地に分かれる分はマルチポリゴンにまとめて
      ある。区域は 1,728 で 47 都道府県にある。指定は合併前の市町村の単位で
      行われているため、合併後の 1 つの市町村に複数の区域が入ることがある
      （行政区域コード 960 のうち 351 が複数の区域を持つ）。

      収録は提供元の最新版である 2016年（平成28年）時点の指定で、行政区域コードも
      その時点のもの。boundary.municipality（令和7年版）と結合するときは
      コードの変更を確かめる。

      出典: 「国土数値情報（特定農山村地域データ）」（国土交通省）。
    access: public
    columns:
      - name: area_code
      - name: lg_code
      - name: prefecture_code
      - name: prefecture_name
      - name: subprefecture_name
      - name: district_name
      - name: municipality_name
      - name: source_municipality_name
      - name: former_municipality_name
      - name: geometry
