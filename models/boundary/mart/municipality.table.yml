schema: boundary
name: municipality
title: 市区町村境界
description: '市区町村の行政区域境界ポリゴン。

  国土数値情報 N03（令和7年）の行政区域データを市区町村単位で集約。

  同一自治体の飛び地等は ST_Union_Agg で統合済み。'
