    title: 全国地方公共団体コード
    description: 5桁（政令指定都市は市レベルのコード）
  - name: prefecture_code
    title: 都道府県コード
  - name: prefecture_name
    title: 都道府県名
  - name: county_name
    title: 郡名
  - name: city_name
    title: 市区町村名
  - name: geometry
    title: 境界ポリゴン
    description: 'CRS: EPSG:4612 (JGD2011)'
