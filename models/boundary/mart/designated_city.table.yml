schema: boundary
name: designated_city
title: 市区町村境界（政令市統合）
description: |-
  市区町村の境界ポリゴンで、政令指定都市の区を市にまとめたものです。

  - 東京 23 区は独立した地方公共団体なのでまとめていません
  - 区から市へのコードの対応は、アドレス・ベース・レジストリの市区町村マスタを使っています
keywords:
  - 国土数値情報
  - 行政区域
  - GIS
  - 境界
published: true
themes: [land_climate]
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N03-2025.html
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: 5桁（政令指定都市は市レベルのコード）
    semantic: { role: entity, name: city }
  - name: prefecture_code
    title: 都道府県コード
    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
  - name: county_name
    title: 郡名
  - name: city_name
    title: 市区町村名
  - name: geometry
    title: 境界ポリゴン
    description: 'CRS: EPSG:4612 (JGD2011)'
