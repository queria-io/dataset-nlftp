schema: medical
name: medical_area_municipality
title: 医療圏の構成市区町村
description: |-
  市区町村がどの二次医療圏に属するかの対応表です。1 行が 1 市区町村です（国土数値情報 A38、2020 年度）。

  - 市区町村のコードは 2020 年度時点の 5 桁です。その後の合併は反映していません
keywords:
  - 国土数値情報
  - 医療圏
  - 二次医療圏
  - 一次医療圏
  - 市区町村
  - 対応表
  - 地域医療
published: true
themes: [social_security_health]
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A38-2020.html
fields:
  - name: admin_code
    title: 行政区域コード
    description: A38a_001。市区町村を特定する5桁のコード
    semantic: { role: entity, name: city }
  - name: municipality_name
    title: 市区町村名
    description: A38a_002。当該市区町村の名称
  - name: prefecture_code
    title: 都道府県コード
    description: 行政区域コードの上2桁
    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: secondary_area_code
    title: 二次医療圏コード
    description: A38a_003。当該市区町村が属する二次医療圏のコード。secondary_medical_area の area_code と結合できる
  - name: secondary_area_name
    title: 二次医療圏名
    description: A38a_004。当該市区町村が属する二次医療圏の名称
  - name: primary_area_defined
    title: 一次医療圏の設定
    description: A38a_005。都道府県が医療計画等で一次医療圏を定義しているかどうか
