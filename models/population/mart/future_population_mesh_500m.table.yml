    title: メッシュコード
    description: 2分の1地域メッシュ（500m四方）の9桁コード。先頭8桁が1kmメッシュのコード。都府県境をまたぐメッシュは県ごとに行が分かれるため一意ではない
  - name: city_code
    title: 市区町村コード
    description: 複数市区町村にまたがるメッシュは "_" 連結
