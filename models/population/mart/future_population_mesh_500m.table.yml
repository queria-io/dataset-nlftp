schema: population
name: future_population_mesh_500m
title: 将来推計人口（500mメッシュ）
description: '500mメッシュ単位の将来推計人口。1kmメッシュでは粗すぎる商圏分析や按分の用途向け。

  国土数値情報「500mメッシュ別将来推計人口（R6国政局推計）」。

  推計値は総務省「令和2年国勢調査」と国立社会保障・人口問題研究所「日本の地域別将来推計人口（令和5年推計）」に基づく。'
keywords:
