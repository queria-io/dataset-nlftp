schema: population
name: future_population_municipality
title: 将来推計人口（市区町村別）
description: |-
  市区町村ごとの将来推計人口（2020〜2070 年、5 年ごと）です。1km メッシュの推計を市区町村に集計したものです。

  - 複数の市区町村にまたがるメッシュの人口は均等に按分しています
  - 政令指定都市は区ごとの行です
keywords:
  - 国土数値情報
  - 将来推計人口
  - 人口
  - 統計
published: true
themes: [population]
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-mesh1000r6.html
fields:
