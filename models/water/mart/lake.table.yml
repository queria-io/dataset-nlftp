fields:
  - name: record_number
    title: レコード番号
    description: 原典のシェープファイルでのレコード番号（0始まり）。湖沼名は一意にならないので、行を特定するのに使う
  - name: lake_name
    title: 湖沼名
    description: W09_001。原典の表記のままで、別名を括弧で併記した行がある
  - name: lg_codes
    title: 行政区域コード
    description: W09_002。湖沼がまたぐ市区町村の2005年時点の5桁コードのリスト（チェックディジット無し）
  - name: prefecture_codes
    title: 都道府県コード
    description: 行政区域コードの先頭2桁を重複なしで並べたリスト
  - name: max_depth_m
    title: 最大水深（m）
    description: W09_003。水面から最も深い所までの深さ。日本の湖沼アトラスに載る自然湖沼の58湖沼にだけ値があり、それ以外は NULL
  - name: water_surface_elevation_m
    title: 水面標高（m）
    description: W09_004。水面の標高。ダム湖・貯水池を含む228湖沼にだけ値があり、それ以外は NULL
  - name: area_km2
    title: 面積（km²）
    description: ポリゴンから計算した回転楕円体上の面積。原典の属性ではない
  - name: geometry
    title: 湖沼ポリゴン
    description: 'CRS: EPSG:4612 (JGD2000)'
