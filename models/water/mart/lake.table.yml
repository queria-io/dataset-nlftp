schema: water
name: lake
title: 湖沼
description: |
  全国の湖沼と貯水池の範囲のポリゴン。数値地図25000（空間データ基盤）から形状を取り、
  湖沼名・行政区域コード・最大水深・水面標高を付けたもの。天然の湖沼だけでなく
  ダム湖や貯水池も入る。国土数値情報 W09（2005年9月1日時点）が元データで、
  1 行 = 1 湖沼、556 行・47都道府県。

  湖沼名は原典の表記のままで、別名を括弧で併記した行がある（「シューパロ湖（シュウパロ湖）」
  など）。「大沼」「白樺湖」など同じ名前の湖沼が別の場所に 14 組あるので、湖沼を
  名前だけで特定しない。

  面積（area_km2）は原典に無く、ポリゴンから回転楕円体上の面積を計算した値。
  最大は琵琶湖の 669.82km² で、中央値は 0.73km²。全 556 湖沼の合計は 2,758.4km²。
  形状は縮尺 1/25,000 の地図から取ったもので、小さな湖沼ほど誤差の割合が大きい。

  最大水深は「日本の湖沼アトラス」（国土地理院）に載る自然湖沼の 58 湖沼にだけあり
  （最大は田沢湖の 423m）。水面標高は 228 湖沼にあり、そのうち 170 は最大水深の無い
  湖沼で、ダム湖や貯水池も多く含む。水面標高の有無で自然湖沼を絞り込まない。
  値が無いのは「浅い」「低い」ではなく「未記載」。原典では最大水深の無い湖沼のうち
  水面標高を持つ行の多くで最大水深に 0 が入っているが、水深 0m の湖沼は無いので
  NULL にしている。水面標高は原典の値のままで、0 の行もそのまま残している。

  行政区域コードは 2005 年時点の 5 桁（チェックディジット無し）で、湖沼がまたぐ
  市区町村の数だけリストに入る（2 つ以上が 126 湖沼）。平成の合併の途中の時点なので、
  boundary.municipality（令和7年版）と結合するときはコードの変更を確かめる。
  都道府県コードは行政区域コードの先頭 2 桁から作っていて、2 都道府県以上に
  またがるのは 22 湖沼。ただし南部片富士湖（岩手県）の 33305 は 03305 の誤記と
  みられ、そのために岡山県が入っている。

  水域の面積を除いた可住地の議論や、土地利用・浸水想定と重ねるときに水面を
  どう扱ったかを明示するのに使える。hazard.low_lying_area（低位地帯）にも湖沼は
  凹地として入るが、そちらは標高メッシュから抽出した範囲で、湖沼名を持たない。

  出典: 「国土数値情報（湖沼データ）」（国土交通省）。
  この地図の作成にあたっては、国土地理院長の承認を得て、同院発行の
  数値地図25000（空間データ基盤）、数値地図25000（地名・公共施設）を使用している
  （承認番号 平27情使、第585号）。
