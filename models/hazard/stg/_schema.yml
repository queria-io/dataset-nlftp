version: 2

models:
  - name: stg_flood_inundation
    description: >
      洪水浸水想定区域（想定最大規模）のステージング。列名を付け替え、
      WKB からジオメトリを復元して ST_MakeValid で修復する。

  - name: stg_tsunami_inundation
    description: >
      津波浸水想定区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復する。

  - name: stg_landslide_hazard_area
    description: >
      土砂災害警戒区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復し、特別警戒未指定フラグを真偽値に直す。
