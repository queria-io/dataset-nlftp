version: 2

models:
  - name: stg_flood_inundation
    description: >
      洪水浸水想定区域（想定最大規模）のステージング。列名を付け替え、
      WKB からジオメトリを復元して ST_MakeValid で修復する。

  - name: stg_tsunami_inundation
    description: >
      津波浸水想定区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復する。

  - name: stg_landslide_hazard_area
    description: >
      土砂災害警戒区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復し、特別警戒未指定フラグを真偽値に直す。

  - name: stg_storm_surge_inundation
    description: >
      高潮浸水想定区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復する。

  - name: stg_pluvial_flood_inundation
    description: >
      雨水出水（内水）浸水想定区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復する。

  - name: stg_multi_stage_flood_inundation
    description: >
      多段階浸水想定のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復する。

  - name: stg_steep_slope_hazard_zone
    description: >
      急傾斜地崩壊危険区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復し、未記載を表す空文字・0・9999/1/1 を NULL に直す。

  - name: stg_landslide_prevention_zone
    description: >
      地すべり防止区域のステージング。WKB からジオメトリを復元して
      ST_MakeValid で修復し、未記載を表す空文字・0・9999/1/1 を NULL に直す。

  - name: stg_sabo_designated_area
    description: >
      砂防指定地のステージング。WKB からジオメトリを復元して ST_MakeValid で修復し、
      未記載を表す空白・0 を NULL に直して、和暦の告示年月日を日付に変換する。
