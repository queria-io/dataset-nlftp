version: 2

models:
  - name: raw_flood_inundation
    description: >
      国土数値情報 A31a（2025年度）の洪水浸水想定区域データ（河川単位・想定最大規模）。
      パイプラインで GeoJSON から変換した河川ごとの Parquet を結合したもの。
      ジオメトリは WKB (BLOB) で保持する。

  - name: raw_tsunami_inundation
    description: >
      国土数値情報 A40（第2.1版）の津波浸水想定データ。
      パイプラインで変換した都道府県 × 整備年度ごとの Parquet を結合したもの。
      オープンデータ利用可の都道府県のみを含み、ジオメトリは WKB (BLOB) で保持する。

  - name: raw_tsunami_license
    description: >
      津波浸水想定データの都道府県別の使用許諾条件。
      提供元の配布ページの記載をパイプラインで取り込んだもの。取り込み範囲の検証に使う。

  - name: raw_landslide_hazard_area
    description: >
      国土数値情報 A33（2025年度版）の土砂災害警戒区域データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもの。
      オープンデータ利用可の都道府県のみを含み、ジオメトリは WKB (BLOB) で保持する。

  - name: raw_landslide_license
    description: >
      土砂災害警戒区域データの都道府県別の使用許諾条件。
      提供元の配布ページの記載をパイプラインで取り込んだもの。取り込み範囲の検証に使う。

  - name: raw_storm_surge_inundation
    description: >
      国土数値情報 A49（2024年度版）の高潮浸水想定区域データ。
      パイプラインで変換した都道府県 × 整備年度ごとの Parquet を結合したもの。
      オープンデータ利用可の都道府県のみを含み、ジオメトリは WKB (BLOB) で保持する。

  - name: raw_storm_surge_license
    description: >
      高潮浸水想定区域データの都道府県別の使用許諾条件。
      提供元の配布ページの記載をパイプラインで取り込んだもの。取り込み範囲の検証に使う。

  - name: raw_pluvial_flood_inundation
    description: >
      国土数値情報 A51（2025年度版）の雨水出水（内水）浸水想定区域データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもの。
      ジオメトリは WKB (BLOB) で保持する。

  - name: raw_multi_stage_flood_inundation
    description: >
      国土数値情報 A53（2025年度版）の多段階浸水想定データ。
      パイプラインで変換した地方整備局等ごとの Parquet を結合したもの。
      ジオメトリは WKB (BLOB) で保持する。

  - name: raw_steep_slope_hazard_zone
    description: >
      国土数値情報 A47（2021年度）の急傾斜地崩壊危険区域データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもの。
      オープンデータ公開の都道府県のみを含み、ジオメトリは WKB (BLOB) で保持する。

  - name: raw_steep_slope_terms
    description: >
      急傾斜地崩壊危険区域データの都道府県別の公開条件。
      提供元が配布する一覧をパイプラインで取り込んだもの。取り込み範囲の検証に使う。

  - name: raw_landslide_prevention_zone
    description: >
      国土数値情報 A46（2021年度）の地すべり防止区域データ。
      パイプラインで変換した都道府県 × 所管省庁ごとの Parquet を結合したもの。
      オープンデータ公開の組み合わせのみを含み、ジオメトリは WKB (BLOB) で保持する。

  - name: raw_landslide_prevention_terms
    description: >
      地すべり防止区域データの都道府県 × 所管省庁別の公開条件。
      提供元が配布する一覧をパイプラインで取り込んだもの。取り込み範囲の検証に使う。

  - name: raw_sabo_designated_area
    description: >
      国土数値情報 A52（2023年度）の砂防指定地データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもの。
      ジオメトリは WKB (BLOB) で保持する。

  - name: raw_sabo_datapoint
    description: >
      砂防指定地データの都道府県別のデータ時点。
      提供元が配布する一覧をパイプラインで取り込んだもの。

  - name: raw_disaster_risk_area
    description: >
      国土数値情報 A48（2021年度）の災害危険区域データ。
      パイプラインで変換した都道府県ごとの Parquet を結合したもの。
      オープンデータ公開の地方公共団体が指定した区域のみを含み、
      ジオメトリは WKB (BLOB) で保持する。

  - name: raw_disaster_risk_area_terms
    description: >
      災害危険区域データの地方公共団体別の公開条件。
      提供元が配布する一覧をパイプラインで取り込んだもの。取り込み範囲の検証に使う。
