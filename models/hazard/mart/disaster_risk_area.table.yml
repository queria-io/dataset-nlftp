schema: hazard
name: disaster_risk_area
title: 災害危険区域
description: |-
  建築基準法第39条に基づいて地方公共団体が条例で指定した災害危険区域のポリゴンです。区域内では住居用の建築物が制限されます（国土数値情報 A48、2021 年度）。

  - 提供元がオープンデータとした地方公共団体（35 都道府県・550 市区町村）だけを収録しています。行が無い場所は「区域が無い」ではなく「収録していない」場合を含みます
  - 1 つの区域が複数のポリゴンに分かれます。指定面積は各行に同じ値が入るので、行のまま合計しないでください
  - 位置は概略で法定図書ではありません。重要事項説明などの根拠には使えません
keywords:
  - 国土数値情報
  - 災害危険区域
  - 建築基準法
  - 建築制限
  - がけ崩れ
  - 津波
  - 高潮
  - 浸水
  - 土砂災害
  - ハザードマップ
  - 防災
  - GIS
annotations: { queria: { themes: [land_climate, justice_safety_environment] } }
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A48-2021.html
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: 区域が属する都道府県を示す2桁のコード。区域を指定した団体の都道府県ではなく、配布の単位
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: municipality_code
    title: 市町村コード
    description: A48_003。区域が存在する市区町村の5桁の代表行政コード。複数の市区町村にまたがる区域は代表の1つが入る
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: municipality_name
    title: 市町村名
    description: A48_002。区域が存在する市区町村名
  - name: designating_body
    title: 指定主体
    description: A48_004。区域を指定した地方公共団体の区分（都道府県 / 市町村）。原典の値で、市が指定した区域に都道府県が入っていることがある（愛媛県の283行）
  - name: zone_name
    title: 区域名
    description: A48_005。区域の箇所名等その区域の名称。都道府県内で一意にならない。未記載の区域（3,239行）は NULL
  - name: address
    title: 所在地
    description: A48_006。区域の所在地。未記載の区域（1,223行）は NULL。原典の桁数の上限で切られている行が233あり、末尾が半角スペースとアスタリスクで終わる
  - name: reason
    title: 指定理由
    description: A48_007。区域を指定した理由の区分（水害（河川） / 水害（海） / 水害（河川・海） / 急傾斜地崩壊等 / 地すべり等 / 火山被害 / その他）
  - name: reason_detail
    title: 指定理由詳細
    description: A48_008。指定した理由の原典の表記。区分と同じ粒度ではなく「津波・高潮」「急傾斜地崩壊」のように団体ごとに書き方が違う
  - name: notice_date
    title: 告示年月日
    description: A48_009。区域が告示された年月日。不明な区域（1,243行）は NULL
  - name: notice_number
    title: 告示番号
    description: A48_010。区域を告示した際の告示番号。書式は団体ごとに違う。未記載の区域は NULL
  - name: ordinance_name
    title: 根拠条例
    description: A48_011。区域を指定した根拠となる条例の名称
  - name: designated_area_ha
    title: 指定面積（ha）
    description: A48_012。区域の面積。区域が複数のポリゴンに分かれていると各行に同じ値が入るので、行のまま合計しない。未記載の区域（10,300行）は NULL
  - name: reference_scale
    title: 縮尺
    description: A48_013。参照資料の縮尺。記載があるのは 3,045 行。未記載は NULL
  - name: remarks
    title: その他
    description: A48_014。地方公共団体が指定する区域の区分や災害危険基準高等。記載があるのは 1,065 行。未記載は NULL
  - name: geometry
    title: 区域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
