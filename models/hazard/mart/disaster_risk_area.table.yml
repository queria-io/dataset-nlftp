schema: hazard
name: disaster_risk_area
title: 災害危険区域
description: |
  災害危険区域の区域ポリゴン。建築基準法第39条に基づいて地方公共団体が条例で
  指定した区域で、区域内では住居の用に供する建築物の建築が条例の定めるところに
  より制限される。国土数値情報 A48（2021年度）が元データ。

  指定するのは都道府県と市町村の両方で、designating_body に提供元の指定主体区分が
  入る（都道府県 12,973 行・市町村 6,332 行）。この区分は原典の値で、市が指定した
  区域に都道府県が入っていることがある。愛媛県は全行が都道府県だが、うち 283 行は
  根拠条例が松山市・今治市・新居浜市・西条市の条例で、実際に指定したのは市。
  どちらが指定したかを厳密に見るときは ordinance_name を併せて読む。砂防三法に基づく区域
  （steep_slope_hazard_zone・landslide_prevention_zone・sabo_designated_area）は
  いずれも都道府県知事が指定するので、指定の主体が違う。規制の内容も違い、
  砂防三法の区域が切土・盛土などの行為を許可制にするのに対して、災害危険区域は
  住居用の建築物そのものを制限する。同じ斜面が両方に入ることも、片方だけに入る
  こともある。

  指定の理由は急傾斜地の崩壊だけではない。reason の内訳は急傾斜地崩壊等 15,084 行・
  水害（海）3,539 行・水害（河川）481 行・水害（河川・海）126 行・地すべり等 63 行・
  火山被害 6 行・その他 6 行で、津波や高潮で住居の建築を制限している区域も含む。

  収録範囲: 災害危険区域データは原典資料を作成した地方公共団体ごとに公開条件が
  異なるため、提供元が「オープンデータにて公開」とした団体が指定した区域のみを
  収録する（35都道府県・550市区町村・19,305ポリゴン）。収録されるのは北海道・
  青森・岩手・宮城・秋田・福島・茨城・栃木・群馬・千葉・東京・神奈川・新潟・富山・
  石川・福井・長野・岐阜・愛知・滋賀・京都・大阪・兵庫・和歌山・鳥取・島根・広島・
  徳島・愛媛・佐賀・長崎・熊本・宮崎・鹿児島・沖縄。
  条件付き公開の9団体と非公開の4団体は含まない（静岡県・広島県・長野県のように
  県指定の区域が丸ごと外れる県があり、静岡県は行が無い）。一覧で「未作成」とされた
  41団体と、区域の属性はあっても形状のデータが配布されていない山形県は提供元から
  配布されていない。「未作成」は GIS データが作られていないという意味で、区域が
  無いという意味ではない（41団体のうち28団体には指定理由が書かれている）。
  全国を網羅したデータではないので、地域をまたいだ比較や面積の合計を出すときは
  収録されている団体を先に確認する。区域が無い場所は「災害危険区域ではない」
  ではなく「収録していない」場合を含む。

  1 行 = 1 ポリゴンで、1 つの区域が複数のポリゴンに分かれることがある。区域名は
  都道府県内で一意にならず、空の行も 3,239 ある。区域を数えるときは
  prefecture_code・municipality_code・zone_name・notice_date・notice_number で
  集約する（19,305 ポリゴンに対して 13,271 区域）。

  指定面積は区域全体の値で、区域が複数のポリゴンに分かれているとその値が各行に
  繰り返し入る。行のまま合計すると分かれている区域を二重に数えるので、上と同じ
  キーで集約してから合計する。さらに 10,300 行（53%）は未記載で、秋田・栃木・
  東京・石川・長野・滋賀・鳥取・広島・宮崎は全行が未記載なので、合計しても
  収録範囲の面積にはならない。

  告示年月日は 1,243 行が未記載。縮尺が入るのは 3,045 行、その他（区域の区分や
  災害危険基準高）が入るのは 1,065 行だけで、いずれも記載する団体が限られる。

  所在地は原典の桁数の上限（254バイト）で切られている行が 233 あり、末尾が
  半角スペースとアスタリスクで終わる。全文は提供元が配布 zip に同梱している
  「254バイト超過リスト」にあり、このテーブルには取り込んでいない。

  位置は縮尺1/25,000相当の概略で（提供元が測った位置のずれの最大値は実寸7.5m）、
  法定図書ではない。宅地建物取引業法に基づく重要事項説明等の根拠には使えない。
  区域の外が「災害が起きない」ことを意味するわけでもなく、厳密な範囲は指定した
  地方公共団体の所管課が持つ区域図で確認する。

  出典: 「国土数値情報（災害危険区域データ）」（国土交通省）。
  原典資料は各地方公共団体が指定する災害危険区域に関する資料。
