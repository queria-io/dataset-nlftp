schema: hazard
name: storm_surge_inundation
title: 高潮浸水想定区域
description: |-
  水防法に基づいて都道府県が設定した、想定最大規模の高潮による浸水域のポリゴンを浸水深の区分ごとに持ちます（国土数値情報 A49、2024 年度）。

  - 提供元がオープンデータとした都道府県だけを収録しています。行が無い場所は「区域が無い」ではなく「収録していない」場合を含みます
  - 浸水深の区分は都道府県が公開している区域図と異なることがあります
keywords:
  - 国土数値情報
  - 高潮
  - 高潮浸水想定区域
  - 浸水想定
  - 浸水深
  - 水防法
  - 沿岸
  - ハザードマップ
  - 防災
  - GIS
published: true
themes: [land_climate, justice_safety_environment]
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A49-2024.html
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: A49_002。区域を設定した都道府県を示す2桁のコード
    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: data_year
    title: 整備年度
    description: 提供元がデータを整備した年度。都道府県ごとに異なる
  - name: depth_label
    title: 浸水深の区分
    description: A49_003。浸水深のランク区分の表記（「0.3m未満」「0.3m以上0.5m未満」など）
  - name: depth_min_m
    title: 浸水深の下限（m）
    description: 区分から読み取った下限。下限の無い区分（「0.3m未満」など）は NULL
  - name: depth_max_m
    title: 浸水深の上限（m）
    description: 区分から読み取った上限。上限の無い区分（「20m以上」など）は NULL
  - name: geometry
    title: 浸水域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
