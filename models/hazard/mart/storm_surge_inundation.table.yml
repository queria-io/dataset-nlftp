schema: hazard
name: storm_surge_inundation
title: 高潮浸水想定区域
description: '高潮浸水想定区域のポリゴン。水防法に基づいて都道府県が設定した、

  想定し得る最大規模の高潮による浸水域を浸水深の区分ごとに持つ。

  国土数値情報 A49（2024年度版）が元データ。


  収録範囲: 高潮浸水想定区域データは原典資料を作成した都道府県ごとに使用許諾

  条件が異なるため、提供元が「オープンデータとして利用可（商用利用可・

  再配信可）」とした都道府県のみを収録する。説明資料の確認が条件に付く

  「条件付き公開」の県は含まない。加えて、高潮浸水想定区域を設定しているのは

  沿岸の都道府県の一部だけで、内陸県には元から設定が無い。区域が無い都道府県は

  値が NULL の行ではなく行そのものが存在しない。全国を網羅したデータではない。


  浸水深の区分（depth_label）は「水害ハザードマップ作成の手引き」の区分（詳細版）を

  基にしているため、都道府県が公開している高潮浸水想定区域図の区分と異なることがある。

  区分から読み取った下限・上限は depth_min_m / depth_max_m に入れてある。


  整備年度（data_year）は都道府県ごとに違う。2023年度以降のデータは提供元が

  過年度整備分を最新年度に統合しているため、統合済みの年度がある県はその年度だけを

  収録する。統合済みの年度が無い県は過年度整備分をそのまま収録する。


  区域の外が「浸水しない」ことを意味するわけではなく、実際の高潮がこの想定より

  大きくなる場合もある。避難の判断には自治体の最新の情報を使う。


  出典: 「国土数値情報（高潮浸水想定区域データ）」（国土交通省）。

  原典資料は各都道府県が作成した高潮浸水想定区域データ。'
