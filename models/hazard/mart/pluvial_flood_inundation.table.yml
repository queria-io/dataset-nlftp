schema: hazard
name: pluvial_flood_inundation
title: 雨水出水（内水）浸水想定区域
description: '雨水出水（内水）浸水想定区域のポリゴン。水防法に基づいて設定された、

  下水道や水路が雨水を捌ききれずに溢れる内水氾濫の浸水域を、浸水深の区分ごとに持つ。

  国土数値情報 A51（2025年度版）が元データ。


  河川の氾濫による洪水浸水想定区域（flood_inundation）とは原因が違う。

  都市部では内水氾濫のほうが被害の主因になることがあり、洪水浸水想定区域だけを

  見ると浸水しないと読めてしまう場所が埋まる。両方を重ねて読む。


  収録範囲: 区域を設定するのは市町村等なので、収録の単位も市区町村になる。

  水防法に基づく指定を受けた区域と、指定前でも想定最大規模降雨の内水浸水想定

  区域図を作成・公表している範囲だけが対象で、全国を網羅したデータではない。

  2025年度版で 22 都道府県・28 市区町村しか入っていない。区域が無い市区町村は

  値が NULL の行ではなく行そのものが存在せず、それは「浸水しない」ではなく

  「まだ想定図が作られていない」場合を含む。


  浸水深の区分（depth_label）は「水害ハザードマップ作成の手引き」の区分（詳細版）を

  基にしているため、市区町村が公開している内水浸水想定区域図の区分と異なることがある。

  区分から読み取った下限・上限は depth_min_m / depth_max_m に入れてある。


  整備年度（data_year）は市区町村ごとに違う。


  実際の内水氾濫の浸水範囲がこの想定より広くなる場合もある。避難の判断には

  自治体の最新の情報を使う。


  出典: 「国土数値情報（雨水出水浸水想定区域データ）」（国土交通省）。

  原典資料は各地方自治体が作成した雨水出水（内水）浸水想定区域データ。'
