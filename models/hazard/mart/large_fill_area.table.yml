schema: hazard
name: large_fill_area
title: 大規模盛土造成地
description: |-
  谷埋め型・腹付け型の大規模盛土造成地のおおよその範囲のポリゴンです。市町村が造成前後の地形図を重ねて抽出したものです（国土数値情報 A54、2023 年）。

  - 安全性の確認が必要な盛土造成地を示すもので、直ちに危険という意味ではありません
  - 1 つの造成地が複数の行に分かれることがあり、行の数は造成地の数ではありません
keywords:
  - 国土数値情報
  - 大規模盛土造成地
  - 盛土
  - 谷埋め型盛土
  - 腹付け型盛土
  - 滑動崩落
  - 宅地造成
  - 盛土規制法
  - 地震
  - ハザードマップ
  - 防災
  - GIS
annotations: { queria: { themes: [land_climate, justice_safety_environment] } }
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A54-2023.html
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: A54_002。盛土造成地がある都道府県を示す2桁のコード
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: municipality_code
    title: 市区町村コード
    description: A54_004。盛土造成地がある市区町村の5桁のコード。政令指定都市は区ではなく市のコード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: municipality_name
    title: 市区町村名
    description: A54_005。盛土造成地がある市区町村名
  - name: fill_type_code
    title: 盛土区分コード
    description: A54_001。盛土の区分を表す1桁のコード（1 / 2 / 9）
  - name: fill_type
    title: 盛土区分
    description: 盛土区分コードの名称。谷埋め型 / 腹付け型 / 区分をしていない
  - name: fill_number
    title: 盛土番号
    description: A54_006。市区町村が付けた盛土造成地の番号。書式は市区町村ごとに違い、市区町村をまたいで一意にならない。1つの盛土造成地が複数の行に分かれると同じ番号が入る。番号を持たない行（豊田市）は NULL
  - name: geometry
    title: 大規模盛土造成地ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
