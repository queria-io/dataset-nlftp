schema: hazard
name: large_fill_area
title: 大規模盛土造成地
description: |
  大規模盛土造成地のポリゴン。谷や沢を埋めた「谷埋め型」と、傾斜地盤上に
  盛土した「腹付け型」の大規模な造成地の概ねの範囲を、市町村が造成前後の
  地形図を重ねて抽出したもの。これまでの大規模地震で滑動崩落の被害が出た
  盛土造成地の実態を踏まえて整備されている。国土数値情報 A54（2023年）が
  元データ。47都道府県・998市区町村・52,530ポリゴン。

  安全性の確認が必要な盛土造成地を示したもので、直ちに危険性のある盛土造成地を
  示すものではない。調査に使ったデータの作成時期や精度によって、すべての
  盛土造成地を抽出できているわけでもなく、今後の調査で追加されることがある。
  最新の情報は各自治体に確認する。
  宅地建物取引業法に基づく重要事項説明等の根拠には使えない。

  盛土区分は谷埋め型が 47,328 行（90%）、腹付け型が 4,299 行、区分をしていない
  ものが 903 行。

  1 つの盛土造成地が複数のポリゴンに分かれて、同じ盛土番号が複数の行に
  入ることがある（同じ市区町村で盛土番号が重なるのは 380 番号・958 行）。
  行の数は盛土造成地の数ではない。盛土番号の書式は市区町村ごとにばらばらで、
  豊田市（331 行）は番号を持たない。

  市区町村コードは政令指定都市でも区ではなく市のコードが入る（横浜市は
  14100 の 3,274 行）。東京都の特別区は区のコードが入る。

  原典のポリゴンのうち 404 は自己交差などで不正な形状だったので
  ST_MakeValid で修復している。

  出典: 「国土数値情報（大規模盛土造成地データ）」（国土交通省）。
