schema: hazard
name: sabo_designated_area
title: 砂防指定地
description: |
  砂防指定地のポリゴン。砂防法第2条に基づいて国土交通大臣が指定した土地で、
  指定地内では土石・砂礫の採取、工作物の設置、樹木の伐採などが都道府県の条例で
  制限される。国土数値情報 A52（2023年度）が元データ。

  急傾斜地崩壊危険区域（steep_slope_hazard_zone）・地すべり防止区域
  （landslide_prevention_zone）とは根拠法が違う。砂防指定地は砂防法、
  急傾斜地崩壊危険区域は急傾斜地法、地すべり防止区域は地すべり等防止法で、
  3つ合わせて砂防三法と呼ばれる。同じ渓流が複数の区域に入ることもある。

  収録範囲: 提供元が原典資料の提供を受けた24都道府県のみを収録する
  （青森・岩手・茨城・栃木・埼玉・千葉・東京・神奈川・新潟・石川・長野・岐阜・
  静岡・滋賀・和歌山・島根・広島・徳島・香川・高知・長崎・熊本・鹿児島・沖縄）。
  残りの23道府県は行そのものが無く、それは「砂防指定地が無い」ではなく
  「提供元が資料の提供を受けていない」。収録された都道府県の中でも
  その県のすべての砂防指定地を網羅しているわけではない。県をまたいだ比較や
  件数の合計を出すときは収録されている都道府県を先に確認する。

  データの時点は都道府県ごとに違う（平成30年3月末〜令和5年6月末）。
  data_as_of に提供元の表記がそのまま入る。

  1 行 = 1 ポリゴンで、1 つの指定地が複数のポリゴンに分かれることがある。
  整理番号は都道府県が使う通し番号で、同じ都道府県・同じ整理番号の行が
  複数あるものが 2,632 組ある。1 つの指定地が分かれたものと、番号の使い回しが
  混ざっていて、209 組は行ごとに指定面積が違う。指定地を数えるときは
  prefecture_code と reference_number で集約するが、整理番号が未記載の
  11,733 行はこの方法では分けられない。

  指定面積が入っているのは 17,337 行（37%）だけで、13都県（茨城・埼玉・千葉・
  東京・石川・長野・岐阜・静岡・滋賀・徳島・香川・長崎・鹿児島）は全行で未記載。
  複数のポリゴンに分かれた指定地では同じ値が各行に繰り返し入るので、
  行のまま合計しない。

  告示年月日は提供元の表記がそろっていない。「昭和42年3月30日」のような
  和暦の年月日として読める 41,690 行（90%）だけを notice_date に日付として
  入れ、年だけのもの・番号らしき数字・複数の告示を並べたものは NULL にする。
  元の表記は notice_date_text に残してあるので、日付にならなかった行は
  そちらで読む（notice_date_text も空白の行が 1,114 ある）。

  位置は縮尺1/25,000〜1/50,000相当の概略で、法定図書ではない。
  宅地建物取引業法に基づく重要事項説明等の根拠や、申請資料・根拠を示す必要が
  ある資料には使えない。厳密な位置は、本データの範囲外であっても
  砂防指定地を指定した管理者（各都道府県の所管課や土木事務所等）が持つ資料で
  確認する。

  出典: 「国土数値情報（砂防指定地データ）」（国土交通省）。
  原典資料は各都道府県の「砂防指定地資料」等。
keywords:
  - 国土数値情報
  - 砂防指定地
  - 砂防
  - 砂防法
  - 砂防三法
  - 土石流
  - 行為制限
  - 土砂災害
  - ハザードマップ
  - 防災
  - GIS
published: true
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A52-2023.html
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: A52_001。指定地がある都道府県を示す2桁のコード
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: municipality_code
    title: 市町村コード
    description: A52_002。市町村名に対する5桁のコード
  - name: municipality_name
    title: 市町村名
    description: A52_003。指定地がある現在の市町村名。複数ある場合は半角カンマ区切りで行政コードの昇順に並ぶ（137行）
  - name: river_name
    title: 河川渓流名
    description: A52_004。指定地の河川渓流名。未記載（775行）は NULL
  - name: tributary_name
    title: 支渓名
    description: A52_005。指定地の支渓名。未記載（33,259行）は NULL
  - name: notice_date
    title: 告示年月日
    description: A52_006 を和暦の年月日として読んだ日付。年だけの表記・番号らしき数字・複数の告示を並べたものは NULL（4,618行）
  - name: notice_date_text
    title: 告示年月日（原文）
    description: A52_006。提供元の表記そのまま。空白（1,114行）は NULL
  - name: notice_number
    title: 告示番号
    description: A52_007。指定された告示番号。書式は都道府県ごとに違う。未記載（1,792行）は NULL
  - name: designated_area_ha
    title: 指定面積（ha）
    description: A52_008。指定された面積。指定地が複数のポリゴンに分かれていると各行に同じ値が入るので、行のまま合計しない。未記載（28,971行）は NULL
  - name: reference_number
    title: 整理番号
    description: A52_009。都道府県で使用しているユニーク番号。都道府県をまたぐと重複する。未記載（11,733行）は NULL
  - name: designation_method
    title: 指定方法
    description: A52_010。「字・地番指定」「線指定」「標柱指定」等の指定方法。表記は都道府県ごとに違う。未記載（39,385行）は NULL
  - name: data_as_of
    title: データ時点
    description: 提供元が都道府県別に公開しているデータの時点。「R5.3末」のような提供元の表記そのままで、新潟県・静岡県の2県は原典が日付なので ISO 形式の日付が入る
  - name: geometry
    title: 指定地ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
