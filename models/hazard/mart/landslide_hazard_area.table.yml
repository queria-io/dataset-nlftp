schema: hazard
name: landslide_hazard_area
title: 土砂災害警戒区域
description: |-
  土砂災害防止法に基づいて都道府県が指定した土砂災害警戒区域・特別警戒区域のポリゴンを、急傾斜地の崩壊・土石流・地滑りの現象ごとに持ちます（国土数値情報 A33、2025 年度）。

  - 提供元がオープンデータとした都道府県だけを収録しています。行が無い場所は「区域が無い」ではなく「収録していない」場合を含みます
  - 警戒区域と特別警戒区域は同じ場所に重なります。面積を合計するときは zone_type で絞ってください
  - 位置は概略で法定図書ではありません。重要事項説明などの根拠には使えません
keywords:
  - 国土数値情報
  - 土砂災害
  - 土砂災害警戒区域
  - イエローゾーン
  - レッドゾーン
  - 急傾斜地
  - 土石流
  - 地滑り
  - ハザードマップ
  - 防災
  - GIS
annotations: { queria: { themes: [land_climate, justice_safety_environment] } }
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A33-2025.html
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: A33_003。区域を指定した都道府県を示す2桁のコード
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: phenomenon_code
    title: 現象種別コード
    description: A33_001。1=急傾斜地の崩壊、2=土石流、3=地滑り
  - name: phenomenon
    title: 現象の種類
    description: 現象種別コードから引いた名称
  - name: zone_code
    title: 区域コード
    description: A33_002。1=警戒区域（指定済）、2=特別警戒区域（指定済）、3=警戒区域（指定前）、4=特別警戒区域（指定前）
  - name: zone_type
    title: 区域の種別
    description: 区域コードから読み取った種別。土砂災害警戒区域 または 土砂災害特別警戒区域
  - name: is_designated
    title: 指定済みか
    description: 区域コードから読み取った指定の状態。false は基礎調査結果の公表段階で指定前
  - name: zone_number
    title: 区域番号
    description: A33_004。都道府県が区域に付けた番号。現象の種類ごとの通し番号で都道府県内では一意にならず、番号を持たない区域は「-」が入る
  - name: zone_name
    title: 区域名
    description: A33_005。区域の名称
  - name: address
    title: 所在地
    description: A33_006。区域の位置する地名。同一の区域名が複数市町村にある場合は「※」で市町村名を示す
  - name: notice_date
    title: 告示日
    description: A33_007。区域を公示した年月日
  - name: special_zone_unspecified
    title: 特別警戒区域未指定
    description: A33_008。警戒区域のみ公示し、特別警戒区域の調査・公示を行っていない区域が true
  - name: geometry
    title: 区域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
