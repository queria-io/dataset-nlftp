schema: hazard
name: low_lying_area
title: 低位地帯
description: |
  低位地帯のポリゴン。周辺よりも標高が低く凹んでいる土地で、多くは自然排水が
  困難で内水氾濫が想定される。国土地理院の数値標高モデル（5m・10m メッシュ）と
  航空レーザ測量の 2m・5m メッシュから、凹地を埋める演算（Fill）で抽出した
  1ha 以上の凹地を収録する。国土数値情報 G08（2015年度）が元データ。
  47都道府県・123,745ポリゴン。

  海面より低い土地（いわゆるゼロメートル地帯）のデータではない。標高が海面より
  高くても、周りより低ければ低位地帯になる。湖沼も凹地として抽出されていて、
  琵琶湖は 67,190.75ha の1ポリゴンとして入っている。

  浸水想定区域（flood_inundation・pluvial_flood_inundation など）は河川や降雨の
  規模を置いて計算した想定で、低位地帯は地形だけから決まる。想定の出ていない
  場所で地形的に水が溜まりやすい所を拾うのに使える。

  最大浸水深は凹地を縁まで水で満たしたときの最深部の深さで、降雨の想定に
  基づく値ではない。中央値は 1.2m だが、カルデラや山間の盆地も凹地として
  抽出されるため、100m 以上が 167 行（27都道府県）あり、最大は 970.4m。
  浸水の深さとして読むのは平野部の小さな凹地に限る。

  面積は低位地帯全体の値で、1 つの低位地帯が複数のポリゴンに分かれると
  同じ値が各行に繰り返し入る（愛知県では 9,250.79ha の同じ値が5行にある）。
  行のまま合計しない。面積属性がポリゴンから計算した面積の 1.1 倍を超える行が
  4,555、0.9 倍を下回る行が 24 あり、後者には霞ヶ浦のように 1万ha を超える
  ポリゴンの面積属性が 2.4ha になっている行を含む。県や市区町村で面積を
  集計するときは geometry から計算する。

  原典のポリゴンのうち 6,182 は自己交差などで不正な形状だったので
  ST_MakeValid で修復している。

  参照資料（抽出に使った標高データ）は地域ごとに違い、精度もそろっていない。
  5mレーザDEM が 94,851 行（77%）で最も多く、10mDEM だけから抽出した行が
  5,953 ある。

  出典: 「国土数値情報（低位地帯データ）」（国土交通省）。
  この地図の作成にあたっては、国土地理院長の承認を得て、同院発行の
  基盤地図情報（数値標高モデル）を使用している（承認番号 平27情使、第585号）。
