schema: hazard
name: steep_slope_hazard_zone
title: 急傾斜地崩壊危険区域
description: |-
  急傾斜地法に基づいて都道府県知事が指定した急傾斜地崩壊危険区域のポリゴンです。区域内では切土・盛土・立木の伐採などに許可が要ります（国土数値情報 A47、2021 年度）。

  - 提供元がオープンデータとした23 都道府県だけを収録しています。行が無い場所は「区域が無い」ではなく「収録していない」場合を含みます
  - 1 つの区域が複数のポリゴンに分かれます。指定面積は各行に同じ値が入るので、行のまま合計しないでください
  - 位置は概略で法定図書ではありません。重要事項説明などの根拠には使えません
keywords:
  - 国土数値情報
  - 急傾斜地崩壊危険区域
  - 急傾斜地
  - 急傾斜地法
  - 崖崩れ
  - 土砂災害
  - 行為制限
  - ハザードマップ
  - 防災
  - GIS
published: true
themes: [land_climate, justice_safety_environment]
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A47-2021.html
fields:
  - name: prefecture_code
    title: 都道府県コード
    description: A47_001。区域を指定した都道府県を示す2桁のコード
    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: municipality_code
    title: 市町村コード
    description: A47_002。区域の所在地となる市区町村の5桁のコード。複数の市区町村にまたがる区域は代表の1つが入る。未記載の区域（385行）は NULL
    semantic: { role: entity, name: city }
  - name: municipality_name
    title: 市町村名
    description: A47_003。現在の所在地となる市町村名。複数の市区町村にまたがる区域は半角カンマ区切りで並ぶ。未記載の区域は NULL
  - name: zone_name
    title: 区域名
    description: A47_004。区域の名称。都道府県内で一意にならない。5都道府県（岩手・茨城・群馬・徳島・佐賀）では提供元の注記「*R3確認済(不明)」が名称に入る
  - name: address
    title: 所在地
    description: A47_005。「住所」「市町村名」等が公示された所在地
  - name: notice_date
    title: 公示年月日
    description: A47_006。区域が指定された年月日。不明な区域は NULL
  - name: notice_number
    title: 公示番号
    description: A47_007。区域を告示した際の公示番号。書式は都道府県ごとに違う。未記載の区域は NULL
  - name: designated_area_ha
    title: 指定面積（ha）
    description: A47_008。公示で指定された当該指定箇所の面積。区域が複数のポリゴンに分かれていると各行に同じ値が入るので、行のまま合計しない。未記載の区域は NULL
  - name: geometry
    title: 区域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
