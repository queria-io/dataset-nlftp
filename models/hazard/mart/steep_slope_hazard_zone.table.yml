schema: hazard
name: steep_slope_hazard_zone
title: 急傾斜地崩壊危険区域
description: |
  急傾斜地崩壊危険区域の区域ポリゴン。急傾斜地の崩壊による災害の防止に関する
  法律（急傾斜地法）第3条に基づいて都道府県知事が指定した区域で、区域内では
  切土・盛土・立木の伐採などが知事の許可を要する。
  国土数値情報 A47（2021年度）が元データ。

  土砂災害警戒区域（landslide_hazard_area）とは根拠法が違う。土砂災害警戒区域は
  土砂災害防止法に基づく警戒避難体制のための区域で、急傾斜地崩壊危険区域は
  行為の制限を伴う区域。同じ斜面が両方に入ることも、片方だけに入ることもある。

  収録範囲: 急傾斜地崩壊危険区域データは原典資料を作成した都道府県ごとに公開条件が
  異なるため、提供元が「オープンデータにて公開」とした23都道府県のみを収録する
  （北海道・青森・岩手・福島・茨城・栃木・群馬・埼玉・新潟・長野・岐阜・静岡・滋賀・
  和歌山・鳥取・島根・岡山・徳島・高知・佐賀・熊本・鹿児島・沖縄）。
  条件付き公開の14県は含まない。非公開の3県と区域を整備していない7県は
  提供元から配布されていない。全国を網羅したデータではないので、県をまたいだ
  比較や件数の合計を出すときは収録されている都道府県を先に確認する。

  1 行 = 1 ポリゴンで、1 つの区域が複数のポリゴンに分かれることがある。
  区域名は都道府県内で一意にならず、同じ名前の区域が複数ある。区域を数えるときは
  prefecture_code・municipality_code・zone_name・notice_date・notice_number で
  集約する（岩手県を除く 16,836 ポリゴンに対して 15,373 区域）。岩手県の 277 行は
  このキーが全行同じ値になるので、区域としては分けられない。

  指定面積は区域全体の値で、区域が複数のポリゴンに分かれているとその値が各行に
  繰り返し入る。行のまま合計すると分かれている区域を二重に数えるので、上と同じ
  キーで集約してから合計する。さらに 9 都道府県（岩手・栃木・埼玉・長野・岐阜・
  静岡・滋賀・徳島・鹿児島）は全行で未記載なので、合計しても収録範囲の面積には
  ならない。和歌山県には指定面積がポリゴンの面積の 1 万倍前後になる行が数十件あり、
  面積の大きい側の外れ値は原典の誤りとして扱う。

  公示年月日は800行が未記載。岩手県の277行は所在地・公示年月日・公示番号が未記載で、
  区域名も全行が提供元の注記「*R3確認済(不明)」だけになっている。

  位置は縮尺1/25,000相当の概略で（提供元が測った位置のずれの最大値は実寸25m）、
  法定図書ではない。
  宅地建物取引業法に基づく重要事項説明等の根拠には使えない。
  区域の外が「斜面の崩壊が起きない」ことを意味するわけでもなく、
  厳密な範囲は指定した都道府県の所管課が持つ資料で確認する。

  出典: 「国土数値情報（急傾斜地崩壊危険区域データ）」（国土交通省）。
  原典資料は各都道府県が整備した急傾斜地崩壊危険区域の GIS データ・公示図書等。
