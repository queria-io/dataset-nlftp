fields:
  - name: bureau_code
    title: 地方整備局等コード
    description: 配布単位の2桁コード（81 北海道開発局 〜 89 九州地方整備局）
  - name: bureau_name
    title: 地方整備局等名
    description: 地方整備局等コードから引いた名称
  - name: river_system_code
    title: 水系コード
    description: A53_001。対象区間で一意にならず、1 つの水系が複数の区間に分かれることがある
  - name: river_system_name
    title: 水系名
    description: A53_002。対象区間が分かれている水系はかっこ書きで区間が入る
  - name: data_year
    title: 整備年度
    description: 提供元がデータを整備した年度。対象区間ごとに異なる
  - name: rainfall_probability_denominator
    title: 降雨規模（年超過確率の分母）
    description: A53_005。10・30・50・100 と河川整備の計画規模 150 または 200。値が大きいほどまれで激しい降雨
  - name: depth_rank_3
    title: 浸水深ランク（3段階）
    description: A53_003。1〜3 のコード
  - name: depth_rank_3_label
    title: 浸水深ランク（3段階）の区分
    description: コードから引いた区分（「0.5m未満」「0.5m以上3m未満」「3m以上」）
  - name: depth_rank_6
    title: 浸水深ランク（6段階）
    description: A53_004。1〜6 のコード。3段階の 3m 以上をさらに分けたもの
  - name: depth_rank_6_label
    title: 浸水深ランク（6段階）の区分
    description: コードから引いた区分（「0.5m未満」から「20m以上」まで）
  - name: depth_min_m
    title: 浸水深の下限（m）
    description: 6段階の区分から読み取った下限
  - name: depth_max_m
    title: 浸水深の上限（m）
    description: 6段階の区分から読み取った上限。上限の無い「20m以上」は NULL
  - name: geometry
    title: 浸水域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
