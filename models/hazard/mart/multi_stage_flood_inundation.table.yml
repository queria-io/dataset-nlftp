schema: hazard
name: multi_stage_flood_inundation
title: 多段階浸水想定
description: |-
  降雨規模ごとの浸水想定のポリゴン。洪水浸水想定区域（flood_inundation）が
  想定最大規模の降雨だけを対象にするのに対し、こちらは 1/10・1/30・1/50・1/100 と
  河川整備の計画規模（1/150 または 1/200）の降雨規模ごとに浸水深の区分を持つ。
  国土数値情報 A53（2025年度版）が元データ。

  1 行 = 対象区間 × 降雨規模 × 浸水深の区分のポリゴン（385万0088行）。同じ場所が
  降雨規模の数だけ重なって入るので、浸水面積や件数を出すときは降雨規模を 1 つに
  絞る。絞らずに合計すると数え上げが数倍になる。

  降雨規模（rainfall_probability_denominator）は年超過確率の分母で、値が大きいほど
  まれで激しい降雨。1/10 は 178,264 行、1/30 は 426,498 行、1/50 は 954,309 行、
  1/100 は 1,485,292 行、1/150 は 786,693 行、1/200 は 19,032 行。
  収録される降雨規模は対象区間ごとに違う。計画規模は区間によって 1/150 か 1/200 の
  どちらか一方で、両方を持つ区間は無い。計画規模が入っているのは 105 区間のうち
  37 区間（1/150 が 32・1/200 が 5）で、1/10 が入っているのは 74 区間。
  降雨規模をまたいで比べるときは、両方の規模を持つ区間に絞る。

  収録範囲: 河川管理者（地方整備局等）が作成した多段階浸水想定図のうち、提供元が
  提供を受けたものだけが入る。2025年度版で 105 の対象区間（水系コードでは 89）。
  区域の無い場所は行そのものが存在せず、それは「浸水しない」ではなく「まだ想定図が
  作られていない」場合を含む。全国の河川を網羅したデータではない。

  水系コード（river_system_code）は対象区間で一意にならない。淀川水系のように
  1 つの水系が（桂川）（木津川上流）（木津川下流）（猪名川）へ分かれる場合があり、
  区間名は水系名（river_system_name）のかっこ書きに入る。区間を数えるときは
  水系名まで含めて集約する（89 の水系コードのうち 11 が複数の区間に分かれる）。

  浸水深は 3 段階（depth_rank_3）と 6 段階（depth_rank_6）の 2 系統で入る。
  6 段階は 3 段階の 3m 以上を 3m以上5m未満・5m以上10m未満・10m以上20m未満・20m以上へ
  分けたもので、0.5m と 3m の区切りは両者で同じ。細かく見るなら 6 段階を使う。
  区分から読み取った下限・上限は depth_min_m / depth_max_m に入れてある。
  6 段階の区切りは洪水浸水想定区域（flood_inundation）の浸水深ランクと同じで、
  ラベルの表記も揃えてある。

  整備年度（data_year）は対象区間ごとに違う（2023年度 229万2463行・2024年度
  97万0027行・2025年度 58万7598行）。石狩川（下流）水系のように、後の年度で
  降雨規模が追加されて 1 つの区間に複数の整備年度が並ぶことがある。

  実際の浸水範囲がこの想定より広くなる場合もある。避難の判断には自治体の最新の
  情報を使う。

  出典: 「国土数値情報（多段階浸水想定データ）」（国土交通省）。
  原典資料は河川管理者が作成した多段階浸水想定図データ。
keywords:
