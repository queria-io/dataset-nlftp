version: 2

_meta: &meta
  source_url: "https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A31a-2025.html"
  published: true
  tags: ["国土数値情報", "洪水", "浸水想定", "ハザードマップ", "GIS"]

models:
  - name: flood_inundation
    description: |
      洪水浸水想定区域（河川単位・想定最大規模 L2）のポリゴン。
      国土数値情報 A31a（2025年度）のうち想定最大規模の浸水区域のみを収録する
      （計画規模・浸水継続時間・家屋倒壊等氾濫想定区域は含まない）。
      河川ごとに浸水深ランク別のポリゴンを持つ。

      浸水深ランク（depth_rank）: 1=0.5m未満、2=0.5m以上3m未満、3=3m以上5m未満、
      4=5m以上10m未満、5=10m以上20m未満、6=20m以上。

      出典: 「国土数値情報（洪水浸水想定区域データ）」（国土交通省）。
      2021年度以降版のライセンスは CC BY 4.0。
    access: public
    config:
      meta:
        <<: *meta
        title: "洪水浸水想定区域（想定最大規模）"
    columns:
      - name: region_code
        meta:
          title: 地域コード
          description: ダウンロード単位の地域コード。都道府県コード（01〜47）または地方整備局等コード（81〜。国管理河川）
      - name: river_code
        meta:
          title: 河川番号
          description: A31a_201。水系と河川を識別する10桁のコード
      - name: river_name
        meta:
          title: 河川名
          description: A31a_202
      - name: admin_name
        meta:
          title: 河川管理者
          description: A31a_204。国土交通大臣（地方整備局等）または都道府県知事
      - name: depth_rank
        meta:
          title: 浸水深ランク
          description: A31a_205（1=0.5m未満、2=0.5m以上3m未満、3=3m以上5m未満、4=5m以上10m未満、5=10m以上20m未満、6=20m以上）
      - name: depth_label
        meta:
          title: 浸水深
          description: 浸水深ランクの日本語ラベル
      - name: geometry
        meta:
          title: 浸水想定区域ポリゴン
          description: "CRS: EPSG:6668 (JGD2011)"
