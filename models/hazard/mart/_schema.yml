version: 2

models:
  - name: flood_inundation
    description: |
      洪水浸水想定区域（河川単位・想定最大規模 L2）のポリゴン。
      国土数値情報 A31a（2025年度）のうち想定最大規模の浸水区域のみを収録する
      （計画規模・浸水継続時間・家屋倒壊等氾濫想定区域は含まない）。
      河川ごとに浸水深ランク別のポリゴンを持つ。

      浸水深ランク（depth_rank）: 1=0.5m未満、2=0.5m以上3m未満、3=3m以上5m未満、
      4=5m以上10m未満、5=10m以上20m未満、6=20m以上。

      出典: 「国土数値情報（洪水浸水想定区域データ）」（国土交通省）。
      2021年度以降版のライセンスは CC BY 4.0。
    access: public
    columns:
      - name: region_code
      - name: river_code
      - name: river_name
      - name: admin_name
      - name: depth_rank
      - name: depth_label
      - name: geometry

  - name: tsunami_inundation
    description: |
      津波浸水想定区域のポリゴン。津波防災地域づくり法に基づいて都道府県が
      設定した、最大クラスの津波が悪条件下で発生した場合の浸水域を
      浸水深の区分ごとに持つ。国土数値情報 A40（第2.1版）が元データ。

      収録範囲: 津波浸水想定データは原典資料を作成した都道府県ごとに使用許諾
      条件が異なるため、提供元が「オープンデータとして利用可（商用利用可・
      再配信可）」とした都道府県のみを収録する。事前連絡や個別の利用規約が
      条件に付く県、商用利用不可の県、提供されない県は含まない。加えて、
      津波浸水想定を設定しているのは沿岸の37道府県（第2.1版時点）だけで、
      内陸県には元から設定が無い。全国を網羅したデータではない。

      浸水深の区分（depth_label）は各都道府県の報告書の表記をそのまま持つため、
      区切りの値も書き方も県ごとに違う。県をまたいで比べるときは区分から
      読み取った depth_min_m / depth_max_m を使う。

      整備年度（data_year）は都道府県ごとに違い、同じ県が複数の年度に分かれる
      ことがある。年度で対象の海域が違う場合があるため（兵庫県は瀬戸内側が
      2016年度・日本海側が2018年度）複数年度をそのまま収録し、範囲が新しい年度に
      収まる旧年度だけを再整備とみなして除いている。

      区域の外が「浸水しない」ことを意味するわけではなく、実際の津波が
      この想定より大きくなる場合もある。避難の判断には自治体の最新の情報を使う。

      出典: 「国土数値情報（津波浸水想定データ）」（国土交通省）。
      原典資料は各都道府県の津波浸水想定データおよび調査報告書。
    access: public
    columns:
      - name: prefecture_code
      - name: prefecture_name
      - name: data_year
      - name: depth_label
      - name: depth_min_m
      - name: depth_max_m
      - name: geometry

  - name: landslide_hazard_area
    description: |
      土砂災害警戒区域（イエローゾーン）・土砂災害特別警戒区域（レッドゾーン）の
      区域ポリゴン。土砂災害防止法第7条に基づいて都道府県が指定した区域を、
      急傾斜地の崩壊・土石流・地滑りという現象の種類ごとに持つ。
      国土数値情報 A33（2025年度版、データ基準日 2025年8月1日）が元データ。

      収録範囲: 土砂災害警戒区域データは原典資料を作成した都道府県ごとに使用許諾
      条件が異なるため、提供元が「オープンデータとしての利用可（商用利用可・
      再配信可）」とした都道府県のみを収録する。公開条件の確認が前提になる
      「条件付公開」の県は含まない。また、収録されている県でも県内のすべての
      区域を網羅しているわけではない。

      1 行 = 1 ポリゴンで、1 つの区域が複数のポリゴンに分かれることがある。
      区域番号は都道府県・現象の種類ごとの通し番号で都道府県内では一意にならないため、
      区域を数えるときは prefecture_code・phenomenon_code・zone_code・zone_number・
      zone_name で集約する。
      警戒区域（zone_code 1・3）と特別警戒区域（zone_code 2・4）は同じ場所に
      重なって収録されるので、面積を合計するときは zone_type で絞る。
      is_designated が false の行は指定前（基礎調査結果の公表段階）を表す。

      位置は縮尺1/25,000〜1/50,000相当の概略で、法定図書ではない。
      宅地建物取引業法に基づく重要事項説明等の根拠には使えない。

      出典: 「国土数値情報（土砂災害警戒区域データ）」（国土交通省）。
    access: public
    columns:
      - name: prefecture_code
      - name: prefecture_name
      - name: phenomenon_code
      - name: phenomenon
      - name: zone_code
      - name: zone_type
      - name: is_designated
      - name: zone_number
      - name: zone_name
      - name: address
      - name: notice_date
      - name: special_zone_unspecified
      - name: geometry

  - name: storm_surge_inundation
    description: |
      高潮浸水想定区域のポリゴン。水防法に基づいて都道府県が設定した、
      想定し得る最大規模の高潮による浸水域を浸水深の区分ごとに持つ。
      国土数値情報 A49（2024年度版）が元データ。

      収録範囲: 高潮浸水想定区域データは原典資料を作成した都道府県ごとに使用許諾
      条件が異なるため、提供元が「オープンデータとして利用可（商用利用可・
      再配信可）」とした都道府県のみを収録する。説明資料の確認が条件に付く
      「条件付き公開」の県は含まない。加えて、高潮浸水想定区域を設定しているのは
      沿岸の都道府県の一部だけで、内陸県には元から設定が無い。全国を網羅した
      データではない。

      浸水深の区分（depth_label）は「水害ハザードマップ作成の手引き」の区分
      （詳細版）を基にしているため、都道府県が公開している高潮浸水想定区域図の
      区分と異なることがある。区分から読み取った下限・上限は
      depth_min_m / depth_max_m に入れてある。

      整備年度（data_year）は都道府県ごとに違う。2023年度以降のデータは提供元が
      過年度整備分を最新年度に統合しているため、統合済みの年度がある県はその年度
      だけを収録する。統合済みの年度が無い県は過年度整備分をそのまま収録する。

      区域の外が「浸水しない」ことを意味するわけではなく、実際の高潮がこの想定より
      大きくなる場合もある。避難の判断には自治体の最新の情報を使う。

      出典: 「国土数値情報（高潮浸水想定区域データ）」（国土交通省）。
    access: public
    columns:
      - name: prefecture_code
      - name: prefecture_name
      - name: data_year
      - name: depth_label
      - name: depth_min_m
      - name: depth_max_m
      - name: geometry
