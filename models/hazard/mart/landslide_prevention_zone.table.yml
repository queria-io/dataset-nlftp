schema: hazard
name: landslide_prevention_zone
title: 地すべり防止区域
description: |
  地すべり防止区域の区域ポリゴン。地すべり等防止法第3条に基づいて主務大臣が
  指定した区域で、区域内では地下水を増やす行為・のり切・切土・ため池や用排水路の
  新築などが都道府県知事の許可を要する。
  国土数値情報 A46（2021年度）が元データ。

  所管省庁が3つに分かれる（国土交通省・農林水産省農村振興局・林野庁）。
  宅地や河川の地すべりは国土交通省、農地の地すべりは農林水産省農村振興局、
  森林の地すべりは林野庁が所管し、同じ都道府県の中に3者の区域が並ぶ。
  competent_agency で区別する（国土交通省 3,114・農林水産省農村振興局 1,201・
  林野庁 1,483 ポリゴン）。

  急傾斜地崩壊危険区域（steep_slope_hazard_zone）・砂防指定地
  （sabo_designated_area）とは根拠法が違う。地すべり防止区域は地すべり等防止法、
  急傾斜地崩壊危険区域は急傾斜地法、砂防指定地は砂防法で、3つ合わせて
  砂防三法と呼ばれる。同じ斜面が複数の区域に入ることも、1つだけに入ることもある。

  収録範囲: 地すべり防止区域データは原典資料を作成した都道府県 × 所管省庁ごとに
  公開条件が異なるため、提供元が「オープンデータにて公開」とした79の組み合わせ
  （43都道府県）のみを収録する。都道府県の単位では欠けが分からないので、
  ある県の区域が全部入っているとは限らない。北海道は国土交通省の区域だけが入り、
  農林水産省農村振興局（非公開）・林野庁（条件付き公開）の区域は入らない。
  3つの所管省庁すべてがオープンデータなのは10都道府県だけで、2つが16、1つが17。
  条件付き公開の26組（成果物への特記事項の明記など県ごとの条件の承諾が前提）は
  含まない。非公開の9組と区域を整備していない27組は提供元から配布されていない。
  千葉県・東京都・福井県・香川県はオープンデータの組み合わせが無いので行が無い。
  全国を網羅したデータではないので、県をまたいだ比較や件数の合計を出すときは
  収録されている組み合わせを先に確認する。

  1 行 = 1 ポリゴンで、1 つの区域が複数のポリゴンに分かれることがある。
  区域名は都道府県内で一意にならず、同じ名前の区域が複数ある。区域を数えるときは
  prefecture_code・competent_agency・municipality_code・zone_name・notice_date・
  notice_number で集約する（5,798 ポリゴンに対して 5,689 区域）。

  指定面積は区域全体の値で、区域が複数のポリゴンに分かれているとその値が各行に
  繰り返し入る。行のまま合計すると分かれている区域を二重に数えるので、上と同じ
  キーで集約してから合計する。さらに 4 府県（埼玉・長野・静岡・京都）は全行で
  未記載なので、合計しても収録範囲の面積にはならない。

  告示年月日は323行、告示番号は409行が未記載。市町村コード・市町村名・所在地が
  未記載の108行は同じ行に重なっている。区域名が提供元の注記だけになっている行が
  あり、「※」が85行、「*R3確認済(不明)」が17行ある。実名の頭に「※」が付く行も
  8行あるので、「※」を含む行は合わせて93行になる。

  位置は縮尺1/25,000相当の概略で（提供元が測った位置のずれの最大値は実寸25m）、
  法定図書ではない。
  宅地建物取引業法に基づく重要事項説明等の根拠には使えない。
  区域の外が「地すべりが起きない」ことを意味するわけでもなく、
  厳密な範囲は指定した区域の管理者（各都道府県）が持つ資料で確認する。

  出典: 「国土数値情報（地すべり防止区域データ）」（国土交通省）。
  原典資料は各都道府県が作成した地すべり防止区域図の GIS データ・画像データ等。
