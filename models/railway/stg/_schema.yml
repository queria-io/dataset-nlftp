version: 2

models:
  - name: stg_railway_section
    description: |
      鉄道路線区間のステージング。鉄道区分コード・事業者種別コードを名称に変換し、
      ジオメトリを修正。
  - name: stg_railway_station
    description: |
      駅のステージング。鉄道区分コード・事業者種別コードを名称に変換し、ジオメトリを修正。
      ジオメトリは当該駅の軌道区間を表すライン。
  - name: stg_station_passenger
    description: |
      駅別乗降客数のステージング。横持ちの年度別列を縦持ちに正規化し、
      鉄道区分・事業者種別・重複・データ有無の各コードを名称に変換し、ジオメトリを修正。
