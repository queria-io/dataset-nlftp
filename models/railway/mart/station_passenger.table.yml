schema: railway
name: station_passenger
title: 駅別乗降客数
description: '駅ごとの1日あたり乗降客数（2011〜2024年度）。

  国土数値情報 S12（2024年度版）を年度の縦持ちに正規化し、駅の代表点（ポイント）を持たせた。

  乗降客数は各鉄道事業者が独自に算出した値で、統一的な基準に基づくものではない。

  複数路線が乗り入れる駅は路線ごとに行が分かれ、乗降客数はそのうち1行にだけ記載される。

  データが無い年度・非公開の年度・まだ駅が無かった年度は乗降客数が NULL になる。'
keywords:
