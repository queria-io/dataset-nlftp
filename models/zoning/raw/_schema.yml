version: 2

models:
  - name: raw_zoning
    description: >
      国土数値情報 A29（第2.1版・令和元年度）の用途地域データ。
      パイプラインで GeoJSON から変換した都道府県ごとの Parquet を結合したもの。
      オープンデータ公開可の市区町村のみを含み、ジオメトリは WKB (BLOB) で保持する。

  - name: raw_zoning_license
    description: >
      用途地域データの市区町村別の公開に関する利用条件。
      提供元が配布する一覧をパイプラインで取り込んだもの。取り込み範囲の検証に使う。
