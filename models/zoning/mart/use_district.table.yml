schema: zoning
name: use_district
title: 用途地域
description: |-
  都市計画法に基づく用途地域（13 種類）のポリゴンと、建ぺい率・容積率です（国土数値情報 A29、令和元年度）。

  - 提供元がオープンデータとした市区町村だけを収録しています。行が無い場所は「区域が無い」ではなく「収録していない」場合を含みます
keywords:
  - 国土数値情報
  - 用途地域
  - 都市計画
  - 建ぺい率
  - 容積率
  - GIS
annotations: { queria: { themes: [housing_land] } }
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A29-v2_1.html
fields:
  - name: admin_code
    title: 行政区域コード
    description: A29_001。用途地域がある市区町村の行政区域コード（5桁）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: prefecture_code
    title: 都道府県コード
    description: 行政区域コードの上2桁
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称（原典の A29_002 は表記揺れがあるため使わない）
  - name: municipality_name
    title: 市区町村名
    description: A29_003
  - name: zoning_code
    title: 用途地域分類コード
    description: A29_004（1〜12、21=田園住居地域、99=不明）
  - name: zoning_name
    title: 用途地域名
    description: 用途地域分類コードの名称
  - name: building_coverage_ratio
    title: 建ぺい率
    description: A29_006。指定建ぺい率（%）。原典で不明（9999）または 0 のときは NULL
  - name: floor_area_ratio
    title: 容積率
    description: A29_007。指定容積率（%）。原典で不明（9999）または 0 のときは NULL
  - name: geometry
    title: 用途地域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
