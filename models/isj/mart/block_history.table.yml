schema: isj
name: block_history
title: 街区レベル位置参照情報（過去の版を含む）
description: |
  平成22年度（10.0a）から令和6年度（24.0a）までの街区レベル位置参照情報を、
  名前と番号（都道府県名・市区町村名・大字・丁目名・小字・通称名・街区符号・地番）
  ごとに 1 行にまとめたもの。町名の変更や区画整理、合併で今の版から消えた名前と番号も、
  最後に載った版の点で残る。

  1 行 = 1 つの名前と番号。first_edition_year と last_edition_year は、その名前と番号が
  最初と最後に載った版の年（原典の CSV のファイル名の年。10.0a は 2011、24.0a は 2025）。
  last_edition_year が今の版の年（2025）より前の行は、今の版に無い名前と番号。点は最後に
  載った版の点で、同じ版で複数の地点に分かれるときは代表フラグの行の点。版ごとに
  座標がわずかにずれる行が多いため、点の違いでは行を分けない。

  15.0a（平成27年度）までの版には小字・通称名の列が無く、大字・丁目名に小字まで
  続けて書いた行がある。その版の行は koaza_name が NULL で、今の版の同じ場所とは
  別の行になる。

  整備の範囲は各版の都市計画区域に相当する範囲だけ。地番の地域では親番だけを持つ。
  座標は街区・地番の代表点で、公共測量などの高い精度が要る測量や各種の証明には
  使えない。原典の履歴フラグが 3（削除）の行は取り込んでいない。

  lg_code は今の市区町村名に一致する行にだけ付けた 6 桁のコード（isj.block と同じ規則）。
  合併で無くなった市町村の名前の行は NULL で、city_name に当時の名前が残る。

  出典: 「街区レベル位置参照情報　国土交通省」（平成22年度 10.0a 〜 令和6年度 24.0a）。
  列名の英字化、座標の数値化、名前と番号ごとの集約、lg_code の付与、都道府県名の
  末尾の数字の除去、削除された行の除外を加工として行っている。
keywords:
  - 位置参照情報
  - 街区レベル位置参照情報
  - 住所
  - 旧住所
  - 町名変更
  - 街区符号
  - 地番
  - 緯度経度
  - ジオコーディング
  - GIS
published: true
themes: [housing_land]
sources:
  - path: https://nlftp.mlit.go.jp/isj/index.html
fields:
  - name: lg_code
    title: 市区町村コード
    description: 今の市区町村名に一致する行の 6 桁の全国地方公共団体コード。合併で無くなった市町村の名前の行は NULL
    semantic: { role: entity, name: city }
  - name: prefecture_name
    title: 都道府県名
  - name: city_name
    title: 市区町村名
    description: 原典の表記のまま。合併で無くなった市町村は当時の名前
  - name: oaza_chome_name
    title: 大字・丁目名
    description: 15.0a までの版では小字まで続けて書いた行がある
  - name: koaza_name
    title: 小字・通称名
    description: 15.0a までの版の行は NULL
  - name: block_number
    title: 街区符号・地番
    description: 住居表示の地域では街区符号、それ以外の地域では地番の親番
  - name: first_edition_year
    title: 最初の版の年
    description: この名前と番号が最初に載った版の年（原典の CSV のファイル名の年。24.0a は 2025）
  - name: last_edition_year
    title: 最後の版の年
    description: この名前と番号が最後に載った版の年。今の版の年（2025）なら今の版にもある
  - name: is_residential_address
    title: 住居表示フラグ
    description: 最後に載った版で住居表示の街区符号なら true、地番なら false
  - name: lat
    title: 緯度
    description: 最後に載った版の点
  - name: lng
    title: 経度
    description: 最後に載った版の点
  - name: geometry
    title: 代表点
    description: 緯度経度の点（世界測地系）
