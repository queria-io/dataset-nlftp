schema: isj
name: block
title: 街区レベル位置参照情報
description: |-
  街区符号（住居表示の地域）または地番（それ以外の地域）ごとの代表点の緯度経度です（国土交通省 街区レベル位置参照情報、令和6年度）。

  - 整備の範囲は都市計画区域に相当する範囲だけで、市区町村の全域ではありません
  - 同じ街区符号・地番が離れた複数の地点に分かれることがあります。1 地点に絞るときは is_representative で絞ってください
keywords:
  - 位置参照情報
  - 街区レベル位置参照情報
  - 住所
  - 街区符号
  - 地番
  - 住居表示
  - 緯度経度
  - ジオコーディング
  - GIS
annotations: { queria: { themes: [housing_land] } }
sources:
  - path: https://nlftp.mlit.go.jp/isj/index.html
fields:
  - name: lg_code
    title: 市区町村コード
    description: ABR の市区町村マスタと都道府県名・市区町村名で突き合わせて付けた 6 桁の全国地方公共団体コード。政令指定都市は区のコード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: prefecture_name
    title: 都道府県名
  - name: city_name
    title: 市区町村名
    description: 原典の表記のまま。郡名を含む町村と含まない町村があり、政令指定都市は市名と区名を続けて書く
  - name: oaza_chome_name
    title: 大字・丁目名
  - name: koaza_name
    title: 小字・通称名
  - name: block_number
    title: 街区符号・地番
    description: 住居表示の地域では街区符号、それ以外の地域では地番の親番
  - name: plane_rectangular_zone
    title: 座標系番号
    description: 平面直角座標系の系の番号
  - name: x
    title: X座標
    description: 平面直角座標系の X 座標（m）
  - name: y
    title: Y座標
    description: 平面直角座標系の Y 座標（m）
  - name: lat
    title: 緯度
  - name: lng
    title: 経度
  - name: is_residential_address
    title: 住居表示フラグ
    description: 住居表示を実施した地域の街区符号なら true、地番なら false
  - name: is_representative
    title: 代表フラグ
    description: 同じ街区符号・地番が複数の地点に分かれるとき、代表点の行で true
  - name: before_update_flag
    title: 更新前履歴フラグ
    description: 前回の整備での変更。0 は変更なし、1 は新規作成、2 は名称変更
  - name: after_update_flag
    title: 更新後履歴フラグ
    description: 今回の整備での変更。0 は変更なし、1 は新規作成、2 は名称変更
  - name: geometry
    title: 代表点
    description: 緯度経度の点（世界測地系）
