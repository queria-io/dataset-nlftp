schema: isj
name: oaza
title: 大字・町丁目レベル位置参照情報
description: |-
  大字・町丁目ごとの代表点の緯度経度です（国土交通省 大字・町丁目レベル位置参照情報、令和6年度）。全国を対象にしています。
keywords:
  - 位置参照情報
  - 大字・町丁目位置参照情報
  - 住所
  - 大字
  - 町丁目
  - 緯度経度
  - ジオコーディング
  - GIS
annotations: { queria: { themes: [housing_land] } }
sources:
  - path: https://nlftp.mlit.go.jp/isj/index.html
fields:
  - name: lg_code
    title: 市区町村コード
    description: 原典の 5 桁の市区町村コードを ABR の市区町村マスタで 6 桁にした全国地方公共団体コード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: prefecture_code
    title: 都道府県コード
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: prefecture_name
    title: 都道府県名
  - name: city_name
    title: 市区町村名
  - name: oaza_chome_code
    title: 大字町丁目コード
    description: 原典の 12 桁のコード
  - name: oaza_chome_name
    title: 大字町丁目名
  - name: oaza_chome_class_code
    title: 大字・字・丁目区分コード
    description: 原典の値のまま
  - name: source_material_code
    title: 原典資料コード
    description: 原典の値のまま
  - name: lat
    title: 緯度
  - name: lng
    title: 経度
  - name: geometry
    title: 代表点
    description: 緯度経度の点（世界測地系）
