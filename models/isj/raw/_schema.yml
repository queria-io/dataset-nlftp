version: 2

models:
  - name: raw_block
    description: >
      街区レベル位置参照情報（令和6年度、24.0a）。都道府県ごとの CSV を
      Parquet にしたもので、列名と値は原典のまま（すべて文字列）。
  - name: raw_oaza
    description: >
      大字・町丁目レベル位置参照情報（令和6年度、19.0b）。都道府県ごとの CSV を
      Parquet にしたもので、列名と値は原典のまま（すべて文字列）。
  - name: raw_block_history
    description: >
      街区レベル位置参照情報の過去の版（平成22年度 10.0a 〜 令和5年度 23.0a）。
      都道府県・版ごとの CSV を Parquet にしたもので、列名と値は原典のまま（すべて文字列）。
      15.0a までの版は列名を今の版にそろえ、無い小字・通称名の列を空で足している。
