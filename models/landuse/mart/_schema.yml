version: 2

models:
  - name: mesh_100m
    description: |
      100m メッシュ単位の土地利用（ポリゴン）。
      国土数値情報 L03-b-u（第3.1版・令和3年度）。3次メッシュを 1/10 に細分した
      100m 四方の区画ごとに、地形図と衛星画像の判読で土地利用を 17 種に分類したもの。

      整備範囲は都市地域（国土数値情報 平成18・23・30年度版都市地域データの範囲内）に
      限られ、令和3年度版は北海道と東北北部が対象外。範囲外のメッシュは行そのものが無い。

      令和3年度版は平成28年度版より高解像度の衛星画像を使っているため、
      同じ区画でも判読結果が変わっていることがある。

      出典: 「国土数値情報（都市地域土地利用細分メッシュデータ）」（国土交通省）。
    access: public
    columns:
      - name: mesh_code
      - name: mesh_1km_code
      - name: landuse_code
      - name: landuse
      - name: survey_date
      - name: geometry
