version: 2

_meta: &meta
  source_url: "https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-L03-b-u-v3_1.html"
  published: true
  tags: ["国土数値情報", "土地利用", "メッシュ", "GIS"]

models:
  - name: mesh_100m
    description: |
      100m メッシュ単位の土地利用（ポリゴン）。
      国土数値情報 L03-b-u（第3.1版・令和3年度）。3次メッシュを 1/10 に細分した
      100m 四方の区画ごとに、地形図と衛星画像の判読で土地利用を 17 種に分類したもの。

      整備範囲は都市地域（国土数値情報 平成18・23・30年度版都市地域データの範囲内）に
      限られ、令和3年度版は北海道と東北北部が対象外。範囲外のメッシュは行そのものが無い。

      令和3年度版は平成28年度版より高解像度の衛星画像を使っているため、
      同じ区画でも判読結果が変わっていることがある。

      出典: 「国土数値情報（都市地域土地利用細分メッシュデータ）」（国土交通省）。
    access: public
    config:
      meta:
        <<: *meta
        title: "土地利用細分メッシュ（100m）"
    columns:
      - name: mesh_code
        meta:
          title: 細分メッシュコード
          description: L03b_u_001。10桁（3次メッシュコード8桁 + 1/10細分の行列2桁）
      - name: mesh_1km_code
        meta:
          title: 1kmメッシュコード
          description: 細分メッシュコードの先頭8桁。基準地域メッシュ（1km四方）で、将来推計人口メッシュの mesh_id と結合できる
      - name: landuse_code
        meta:
          title: 土地利用種別コード
          description: L03b_u_002（0100=田、0200=その他の農用地、0500=森林、0600=荒地、0701=高層建物、0702=工場、0703=低層建物、0704=低層建物（密集地）、0901=道路、0902=鉄道、1001=公共施設等用地、1002=空地、1003=公園・緑地、1100=河川地及び湖沼、1400=海浜、1500=海水域、1600=ゴルフ場）
      - name: landuse
        meta:
          title: 土地利用種別
          description: 土地利用種別コードを名称に変換したもの
      - name: survey_date
        meta:
          title: 衛星写真撮影年月日
          description: L03b_u_003。土地利用種別を判読した衛星写真の撮影日
      - name: geometry
        meta:
          title: メッシュポリゴン
          description: "CRS: EPSG:6668 (JGD2011)。100m四方の区画"
