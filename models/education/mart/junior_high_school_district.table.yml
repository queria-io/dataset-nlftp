    description: A32_001。中学校が存在する市区町村の行政区域コード（5桁）
  - name: prefecture_code
    title: 都道府県コード
    description: 行政区域コードの上2桁
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: municipality_name
    title: 市区町村名
    description: 提供元の利用条件一覧から引いた名称（原典の属性には市区町村名が無い）
  - name: school_code
    title: 学校コード
    description: A32_003。文部科学省の学校コード。facility.school の school_code と結合できる。原典で未設定の区域と、コードの形式でない値は NULL
  - name: school_name
    title: 名称
    description: A32_004。中学校の名称
  - name: establisher
    title: 設置主体
    description: A32_002。「◯◯市立」など。表記は市区町村により揺れる
  - name: address
    title: 所在地
    description: A32_005。中学校の所在地
  - name: geometry
    title: 通学区域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
