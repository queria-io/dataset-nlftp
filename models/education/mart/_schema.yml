version: 2

models:
  - name: elementary_school_district
    description: |
      市区町村の教育委員会等が指定する、公立小学校ごとの通学区域のポリゴン。
      1 行 = 1 小学校の通学区域で、文部科学省の学校コードを持つ。
      国土数値情報 A27（2023年度）が元データ。

      収録範囲: 通学区域データは原典資料を作成した市区町村ごとに公開条件が
      異なるため、提供元の「公開に関する利用条件」で利用条件がオープンデータ公開と
      された市区町村のみを収録する。条件公開・商用利用不可・商用利用および再配布不可・
      公開不可の市区町村は含まない。加えて、資料を収集できず提供元が区域を作成して
      いない市区町村もある。全国の小学校区を網羅したデータではない点に注意。

      通学区域はおおよその範囲で、空間的な誤差を含む。順次見直されるため最新の
      指定状況が反映されていない場合があり、公式な資料としては扱えない。
      私立小学校・特別支援学校・国立大学附属小学校は対象外。

      出典: 「国土数値情報（小学校区データ）」（国土交通省）。
    access: public
    columns:
      - name: admin_code
      - name: prefecture_code
      - name: prefecture_name
      - name: municipality_name
      - name: school_code
      - name: school_name
      - name: establisher
      - name: address
      - name: geometry

  - name: junior_high_school_district
    description: |
      市区町村の教育委員会等が指定する、公立中学校ごとの通学区域のポリゴン。
      1 行 = 1 中学校の通学区域で、文部科学省の学校コードを持つ。
      国土数値情報 A32（2023年度）が元データ。

      収録範囲: 通学区域データは原典資料を作成した市区町村ごとに公開条件が
      異なるため、提供元の「公開に関する利用条件」で利用条件がオープンデータ公開と
      された市区町村のみを収録する。条件公開・商用利用不可・商用利用および再配布不可・
      公開不可の市区町村は含まない。加えて、資料を収集できず提供元が区域を作成して
      いない市区町村もある。全国の中学校区を網羅したデータではない点に注意。
      公開条件は小学校区と中学校区で別々に定められているため、収録される市区町村も
      小学校区とは一致しない。

      通学区域はおおよその範囲で、空間的な誤差を含む。順次見直されるため最新の
      指定状況が反映されていない場合があり、公式な資料としては扱えない。
      私立中学校・特別支援学校・国立大学附属中学校は対象外。

      出典: 「国土数値情報（中学校区データ）」（国土交通省）。
    access: public
    columns:
      - name: admin_code
      - name: prefecture_code
      - name: prefecture_name
      - name: municipality_name
      - name: school_code
      - name: school_name
      - name: establisher
      - name: address
      - name: geometry
