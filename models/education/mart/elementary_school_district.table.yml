schema: education
name: elementary_school_district
title: 小学校区
description: |-
  公立小学校ごとの通学区域のポリゴンです。1 行が 1 小学校の区域で、文部科学省の学校コードを持ちます（国土数値情報 A27、2023 年度）。

  - 提供元がオープンデータとした市区町村だけを収録しています。行が無い場所は「区域が無い」ではなく「収録していない」場合を含みます
  - 区域はおおよその範囲で、最新の指定とは異なることがあります
keywords:
  - 国土数値情報
  - 小学校区
  - 学区
  - 通学区域
  - 学校
  - GIS
published: true
themes: [education_culture]
sources:
  - path: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A27-2023.html
fields:
  - name: admin_code
    title: 行政区域コード
    description: A27_001。小学校が存在する市区町村の行政区域コード（5桁）
    semantic: { role: entity, name: city }
  - name: prefecture_code
    title: 都道府県コード
    description: 行政区域コードの上2桁
    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
    description: 都道府県コードから引いた名称
  - name: municipality_name
    title: 市区町村名
    description: 提供元の利用条件一覧から引いた名称（原典の属性には市区町村名が無い）
  - name: school_code
    title: 学校コード
    description: A27_003。文部科学省の学校コード。facility.school の school_code と結合できる。原典で未設定の区域と、コードの形式でない値は NULL
  - name: school_name
    title: 名称
    description: A27_004。小学校の名称
  - name: establisher
    title: 設置主体
    description: A27_002。「◯◯市立」など。表記は市区町村により揺れる
  - name: address
    title: 所在地
    description: A27_005。小学校の所在地
  - name: geometry
    title: 通学区域ポリゴン
    description: 'CRS: EPSG:6668 (JGD2011)'
