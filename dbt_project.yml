name: "nlftp"
version: "1.0.0"

profile: "nlftp"

model-paths: ["models"]
macro-paths: ["macros", "shared/macros"]
clean-targets: ["target", "dbt_packages"]

models:
  nlftp:
    +database: nlftp
    +materialized: view
    boundary:
      raw:
        +materialized: table
      stg:
        +materialized: table
    population:
      raw:
        +materialized: table
      stg:
        +materialized: table
    railway:
      raw:
        +materialized: table
      stg:
        +materialized: table
    facility:
      raw:
        +materialized: table
      stg:
        +materialized: table
    transit:
      raw:
        +materialized: table
      stg:
        +materialized: table
    hazard:
      # raw と stg を実体化し、mart は view にする。ST_MakeValid などの spatial の
      # 関数は stg に寄せてあり、stg が view だと spatial 拡張を読み込んでいない
      # ブラウザの DuckDB からは stg も mart も読めない。mart まで実体化すると
      # 数百万ポリゴンを 3 重に持つので、mart は view のままにする
      raw:
        +materialized: table
      stg:
        +materialized: table
    landuse:
      # raw のみ実体化する（100mメッシュが数百万ポリゴン）。stg / mart の
      # ST_GeomFromWKB は DuckDB 本体にあるので、view でも spatial なしで読める
      raw:
        +materialized: table
    zoning:
      # hazard と同じく raw と stg を実体化し、mart は view にする
      raw:
        +materialized: table
      stg:
        +materialized: table
    education:
      # 公開する mart は実体化する（ジオメトリの補正をブラウザ側で毎回やらせない）。
      # stg は view のままにして同じポリゴンを 3 重に持たない
      raw:
        +materialized: table
    medical:
      # education と同じく raw と mart だけを実体化する
      raw:
        +materialized: table
    region:
      # 指定区域のポリゴンは行政区域から切り出したもので数が限られるため、
      # raw と mart を実体化して stg は view のままにする
      raw:
        +materialized: table
