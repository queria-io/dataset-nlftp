name: "nlftp"
version: "1.0.0"

profile: "nlftp"

model-paths: ["models"]
macro-paths: ["macros", "shared/macros"]
clean-targets: ["target", "dbt_packages"]

models:
  nlftp:
    +database: nlftp
    +materialized: view
    boundary:
      raw:
        +materialized: table
      stg:
        +materialized: table
    population:
      raw:
        +materialized: table
      stg:
        +materialized: table
    railway:
      raw:
        +materialized: table
      stg:
        +materialized: table
    facility:
      raw:
        +materialized: table
      stg:
        +materialized: table
    hazard:
      # raw のみ実体化し、stg / mart は view として二重にストレージを
      # 消費しないようにする（全国で数百万ポリゴンあるため）
      raw:
        +materialized: table
