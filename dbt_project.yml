name: "nlftp"
version: "1.0.0"

profile: "nlftp"

model-paths: ["models"]
macro-paths: ["macros", "shared/macros"]
clean-targets: ["target", "dbt_packages"]

models:
  nlftp:
    +database: nlftp
    +materialized: view
    boundary:
      raw:
        +materialized: table
      stg:
        +materialized: table
    population:
      raw:
        +materialized: table
      stg:
        +materialized: table
    railway:
      raw:
        +materialized: table
      stg:
        +materialized: table
    facility:
      raw:
        +materialized: table
      stg:
        +materialized: table
    transit:
      raw:
        +materialized: table
      stg:
        +materialized: table
    hazard:
      # raw のみ実体化し、stg / mart は view として二重にストレージを
      # 消費しないようにする（全国で数百万ポリゴンあるため）
      raw:
        +materialized: table
    landuse:
      # hazard と同じ理由で raw のみ実体化する（100mメッシュが数百万ポリゴン）
      raw:
        +materialized: table
    zoning:
      # hazard と同様、ポリゴンが大きいので raw のみ実体化する
      raw:
        +materialized: table
    education:
      # 公開する mart は実体化する（ジオメトリの補正をブラウザ側で毎回やらせない）。
      # stg は view のままにして同じポリゴンを 3 重に持たない
      raw:
        +materialized: table
