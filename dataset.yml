temporal_coverage: { start: "2020", end: "2070" }
spatial_coverage: [JP]
update_frequency: yearly
cover: 🗾

ai_context:
  instructions: |
    境界ポリゴンで地図を描く、施設や駅からの到達圏を見る、将来人口とハザードを重ねる、
    といった GIS 分析の土台に使う。
    元データは種類ごとに整備年が違う。行政区域は令和7年（2025）版、鉄道は令和6年版、
    駅別乗降客数は2024年度版（2011〜2024年度を収録）、
    医療機関は令和2年（P04 第3.0版）、学校は令和3年（P29 第2.0版）、
    市町村役場等及び公的集会施設は令和4年（P05 2022年版）、
    通学区域は2023年度（A27 小学校区 / A32 中学校区）、
    人口集中地区は令和2年（2020年）国勢調査（A16）、
    津波浸水想定は都道府県ごとに2016〜2022年度、土砂災害警戒区域は2025年度、
    高潮浸水想定は都道府県ごとに2020〜2024年度、
    バス停留所・バスルートは令和4年度（P11 第3.0版 / N07）、
    洪水浸水想定は2025年度版、土地利用細分メッシュは令和3年度（L03-b-u 第3.1版）。
    施設データは整備年が古いので、開設・廃止の反映は遅れる。
    将来推計人口は国立社会保障・人口問題研究所の令和5年推計に基づく2020〜2070年の
    5年ごとの推計値で、実績値ではない。市区町村別（1898行）と1kmメッシュ別（17万7791行）がある。
    市区町村境界は政令指定都市を区単位で収録し、lg_code は5桁（チェックディジット無し）。
    6桁の lg_code や address_br と結合するときは桁を揃える。市単位で見たいときは
    designated_city（政令市を統合した境界）を使う。
    洪水浸水想定は想定最大規模（L2）の区域のみで、計画規模や浸水継続時間は含まない。
    浸水想定区域が指定されていない河川・区域は「安全」ではなく「未指定」。
    津波浸水想定は都道府県ごとに使用許諾条件が違うため、オープンデータとして
    利用可とされた都道府県のみを収録する。津波浸水想定を設定しているのは
    沿岸の37道府県だけなので、内陸県はそもそも対象外。浸水深の区分は
    各都道府県の報告書の表記そのままで区切りが県ごとに違うため、県をまたいで
    比べるときは depth_min_m / depth_max_m を使う。同じ県に複数の整備年度が
    あるのは対象の海域が違うからで、年度を絞ると範囲が欠ける。
    土砂災害警戒区域も都道府県ごとに使用許諾条件が違うため、オープンデータ
    利用可とされた都道府県のみを収録する（公開条件の確認が前提になる県は
    含まない）。1 行 = 1 ポリゴンで、1 つの区域が複数のポリゴンに
    分かれる。区域番号は都道府県・現象の種類ごとの通し番号で都道府県内では
    一意にならないので、区域を数えるときは区域名まで含めて集約する。
    警戒区域と特別警戒区域は同じ場所に重なって収録されるので、面積を出すときは
    区域の種別で絞る。位置は概略で、宅地建物取引業法の重要事項説明の根拠には使えない。
    高潮浸水想定も都道府県ごとに使用許諾条件が違うため、オープンデータ利用可と
    された都道府県のみを収録する。設定しているのは沿岸の都道府県の一部だけなので、
    区域が無い都道府県は行そのものが無い。浸水深の区分は「水害ハザードマップ
    作成の手引き」の詳細版の区分に基づくため、都道府県が公開する区域図の区分とは
    異なることがある。2023年度以降は提供元が過年度整備分を最新年度に統合しており、
    統合済みの年度がある県はその年度だけを収録している。
    用途地域は令和元年（2019）度版で、市区町村ごとに公開条件が違うため
    「オープンデータ公開可」とされた市区町村のみを収録する。
    全国の用途地域を網羅したデータではないので、地域間の比較や面積の合計を
    出すときは収録されている市区町村を先に確認する。
    通学区域（小学校区・中学校区）は2023年度版で、1 行 = 1 校の学区ポリゴン。
    用途地域と同じく市区町村ごとに利用条件が違うため、「オープンデータ公開」と
    された市区町村のみを収録する（小学校区 1,564 市区町村・中学校区 1,562 市区町村）。
    全国を網羅していないので、学区の無い地域は「学区が無い」ではなく「収録していない」。
    学校コードで facility.school と結合できるが、学校データは令和3年版で学区より古く、
    98% 程度しか一致しない。学区はおおよその範囲で誤差を含み、公式な資料としては使えない。
    座標参照系は EPSG:6668（JGD2011）が中心で、行政区域のみ EPSG:4612。
    バスは高速バス・デマンドバス・貸切バス・スクールバスを含まない。バスルートは
    経路を細かい区間に分けて持つため 1 行 = 1 区間で、事業者単位で見るなら集約する。
    令和4年度版のバスルートには系統名も運行頻度も無いので、便数の分析には使えない。
    駅別乗降客数は 1 行 = 駅 × 年度で、値は各鉄道事業者が独自に算出した1日あたりの人数。
    統一的な基準に基づく数値ではないので、事業者をまたぐ比較は幅を持って見る。
    複数路線が乗り入れる駅は路線ごとに行が分かれ、乗降客数はそのうち1行にだけ記載される。
    駅としての合計を出すなら station_group_code で集約する。データが無い年度・非公開の年度・
    まだ駅が無かった年度は NULL で、0 人ではない。station とは station_code で結合できるが、
    廃止された駅も乗降客数側には残るので数十行は結合先が無い。
    土地利用細分メッシュは 100m 四方の区画ごとに土地利用を 17 種で持つ。整備範囲は
    都市地域に限られ、令和3年度版は北海道と東北北部が対象外。範囲外は行そのものが無いので
    「土地利用が無い」ではなく「調べていない」。細分メッシュコードの先頭8桁が 1km メッシュの
    コードなので、将来推計人口メッシュと結合して人口と土地利用を重ねられる。
    医療圏は都道府県が医療計画の中で定める区域で、二次医療圏（一般の入院）と
    三次医療圏（特殊な医療）の区域を持つ。2020年度時点の計画に基づくので、
    その後の見直しや市町村合併は反映されていない。一次医療圏は市区町村と同じ区域
    なので、区域は行政区域を使い、医療圏との対応だけを対応表で持つ。二次医療圏の
    面積・人口は医療計画に載る値と、面積調・住民基本台帳を構成市区町村について
    合計した値の2通りがあり、医療圏をまたいで比べるなら後者を使う。三次医療圏は
    北海道だけが6圏域に分かれ、他の都府県は全域が1圏域で名称が空になる。
    医療機関（P04）と空間結合すれば医療圏あたりの病床数や施設数を出せる。
    ポリゴンは大きいので、地図に出すときは ST_Simplify と件数制限を併用する。
    市町村役場等及び公的集会施設は 1 行 = 1 施設で、施設分類で役場系（本庁・支所・
    その他の行政サービス施設）と集会施設系（公立公民館・集会施設）に分かれる。
    全 79,532 件のうち集会施設が 49,488 件・公立公民館が 21,302 件で、大半は集会施設。
    自治体の代表点が欲しいときは本庁（1,908 件）に絞るが、行政区域と 1 対 1 ではない。
    政令指定都市は区役所も本庁なので市に 1 点ではなく、市役所と区役所が同じ区にあると
    2 点になる。逆に本庁が 1 件も無い行政区域も 25 ある（北方領土の 6 村のように施設が
    存在しないものと、原典の分類が支所やその他の行政サービス施設になっているもの）。
    原典は各市区町村の公式サイトと全国公民館名鑑で、全ての施設を網羅できていない
    可能性がある。市区町村名は原典に無く行政区域（令和7年版）から補っているため、
    2022年以降に廃置分合のあった行政区域コードは NULL になる（浜松市の旧 7 区など 186 件）。
    人口集中地区（DID）は人口密度の高い市街地を面で表す国勢調査の区域で、
    都市部と非都市部を分けた比較の分母に使える。1 行 = 1 地区で、同じ市区町村に
    複数の地区があると人口の多い順に符号が振られて行が分かれる。市区町村単位で
    見るときは行政区域コードで集約する。地区が無い市区町村は行そのものが無いので
    「DID 人口 0」ではなく「対象外」。行政区域コードは2020年時点なので、
    行政区域（令和7年版）と結合するときは廃置分合を確かめる。
  synonyms: [国土数値情報, 行政区域, 境界データ, 人口集中地区, DID, 市街地, 将来推計人口, 浸水想定区域, 津波浸水想定, 高潮浸水想定, 土砂災害警戒区域, イエローゾーン, レッドゾーン, 用途地域, 学区, 通学区域, 医療圏, 二次医療圏, 三次医療圏, KSJ]
  examples:
    - 市区町村の境界ポリゴンを地図に出したい
    - 駅からの距離で人口を集計したい
    - 乗降客数の多い駅の周辺で出店先を探したい
    - コロナ前後で駅の利用者がどれだけ戻ったか比べたい
    - 浸水想定区域に入る学校を調べたい
    - 津波の浸水想定区域にかかる駅や施設を調べたい
    - 高潮の浸水想定区域にかかる沿岸部の施設を調べたい
    - 土砂災害警戒区域にかかる学校や福祉施設を調べたい
    - バス停から徒歩圏にある住宅地を調べたい
    - 市街地の土地利用の内訳を100mメッシュで見たい
    - 商業地域や工業専用地域の範囲を地図に出したい
    - 小学校の学区ごとに人口や世帯数を集計したい
    - 引越し先の住所がどの学区に入るか調べたい
    - 二次医療圏ごとの人口あたりの病院数を比べたい
    - 自分の住む市区町村がどの医療圏に入るか調べたい
    - 市役所や町役場の位置を自治体の代表点として地図に出したい
    - 最寄りの公民館や集会施設を探したい
    - 市街地（人口集中地区）の範囲を地図に出したい
    - 市区町村ごとに人口集中地区に住む人の割合を比べたい
    - 出店候補が市街地の中に入っているか判定したい

