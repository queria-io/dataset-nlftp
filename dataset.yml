spec_version: "0.1"
name: nlftp
title: 国土数値情報
description: |-
  国土交通省「国土数値情報ダウンロードサイト」(nlftp.mlit.go.jp) から取得した GIS データ。
  地形、土地利用、公共施設などの国土に関する基礎的な情報を提供。
