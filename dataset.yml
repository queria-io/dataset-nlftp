spec_version: "0.1"
name: nlftp
title: 国土数値情報
description: |-
  国土交通省「国土数値情報ダウンロードサイト」(nlftp.mlit.go.jp) から取得した GIS データ。
  地形、土地利用、公共施設などの国土に関する基礎的な情報を提供。
keywords:
  - GIS
  - 国土数値情報
  - 境界
  - 行政区域
  - 人口
  - 将来推計人口
  - 鉄道
  - 駅
  - バス
  - バス停留所
  - 公共交通
  - 医療機関
  - 学校
  - 施設
  - 洪水
  - 浸水想定
  - ハザードマップ
  - 土地利用
  - メッシュ
homepage: https://github.com/queria-io/dataset-nlftp
language: ja

licenses:
  - JP-MLIT-NLFTP

sources:
  - title: 国土数値情報ダウンロードサイト（国土交通省）
    path: https://nlftp.mlit.go.jp/

contributors:
  - title: 国土交通省
    path: https://www.mlit.go.jp/
    roles: [rightsHolder]
  - title: 国立社会保障・人口問題研究所
    path: https://www.ipss.go.jp/
    roles: [contributor]

temporal_coverage: { start: "2020", end: "2070" }
spatial_coverage: [JP]
update_frequency: yearly
cover: 🗾

ai_context:
  instructions: |
    境界ポリゴンで地図を描く、施設や駅からの到達圏を見る、将来人口とハザードを重ねる、
    といった GIS 分析の土台に使う。
    元データは種類ごとに整備年が違う。行政区域は令和7年（2025）版、鉄道は令和6年版、
    医療機関は令和2年（P04 第3.0版）、学校は令和3年（P29 第2.0版）、
    バス停留所・バスルートは令和4年度（P11 第3.0版 / N07）、
    洪水浸水想定は2025年度版、土地利用細分メッシュは令和3年度（L03-b-u 第3.1版）。
    施設データは整備年が古いので、開設・廃止の反映は遅れる。
    将来推計人口は国立社会保障・人口問題研究所の令和5年推計に基づく2020〜2070年の
    5年ごとの推計値で、実績値ではない。市区町村別（1898行）と1kmメッシュ別（17万7791行）がある。
    市区町村境界は政令指定都市を区単位で収録し、lg_code は5桁（チェックディジット無し）。
    6桁の lg_code や address_br と結合するときは桁を揃える。市単位で見たいときは
    designated_city（政令市を統合した境界）を使う。
    洪水浸水想定は想定最大規模（L2）の区域のみで、計画規模や浸水継続時間は含まない。
    浸水想定区域が指定されていない河川・区域は「安全」ではなく「未指定」。
    座標参照系は EPSG:6668（JGD2011）が中心で、行政区域のみ EPSG:4612。
    バスは高速バス・デマンドバス・貸切バス・スクールバスを含まない。バスルートは
    経路を細かい区間に分けて持つため 1 行 = 1 区間で、事業者単位で見るなら集約する。
    令和4年度版のバスルートには系統名も運行頻度も無いので、便数の分析には使えない。
    土地利用細分メッシュは 100m 四方の区画ごとに土地利用を 17 種で持つ。整備範囲は
    都市地域に限られ、令和3年度版は北海道と東北北部が対象外。範囲外は行そのものが無いので
    「土地利用が無い」ではなく「調べていない」。細分メッシュコードの先頭8桁が 1km メッシュの
    コードなので、将来推計人口メッシュと結合して人口と土地利用を重ねられる。
    ポリゴンは大きいので、地図に出すときは ST_Simplify と件数制限を併用する。
  synonyms: [国土数値情報, 行政区域, 境界データ, 将来推計人口, 浸水想定区域, KSJ]
  examples:
    - 市区町村の境界ポリゴンを地図に出したい
    - 駅からの距離で人口を集計したい
    - 浸水想定区域に入る学校を調べたい
    - バス停から徒歩圏にある住宅地を調べたい
    - 市街地の土地利用の内訳を100mメッシュで見たい

schemas:
  - name: boundary
    title: 行政区域境界データ
  - name: population
    title: 将来推計人口
  - name: railway
    title: 鉄道
  - name: facility
    title: 施設
  - name: transit
    title: バス
  - name: hazard
    title: ハザード
  - name: landuse
    title: 土地利用
