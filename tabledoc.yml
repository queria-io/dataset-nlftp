name: nlftp
title: 国土数値情報
description: |-
  国土交通省の国土数値情報の GIS データです。行政区域の境界、人口集中地区、将来推計人口のメッシュ、鉄道・駅・バス、医療機関・学校・福祉施設、洪水・津波・土砂災害などのハザード、用途地域・通学区域・医療圏、街区と大字・町丁目の位置参照情報を収録しています。

  出典：国土交通省「国土数値情報」「位置参照情報」を加工して作成。
